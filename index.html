<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hermes">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="manifest" href="/manifest.json">
<title>Hermes · 手机端</title>
<style>
:root{
  --bg:#0b0f14; --bg2:#0f151d; --fg:#e6edf3; --dim:#8b98a5; --line:#1e2933;
  --acc:#4ea1ff; --acc-dim:#1c4a7a; --user:#1d4ed8; --card:#121a23; --ok:#3fb950; --warn:#d29922; --err:#f85149;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none;
  /* manipulation = pan + pinch-zoom，但没有 double-tap-zoom。
     去掉 viewport 的 maximum-scale 是为了能双指放大看代码，代价是双击也会缩放 ——
     双击在气泡上是要触发点击的，所以在这里单独把双击缩放关掉，双指仍然可用。 */
  touch-action:manipulation;
}
#app{display:flex;flex-direction:column;height:100dvh}
header{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:var(--bg2);border-bottom:1px solid var(--line);
}
header .ttl{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
header .ttl:active{opacity:.65}
header .sub{display:block;font-weight:400;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.icon{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;
  background:var(--card);border:1px solid var(--line);flex:0 0 auto;position:relative;
}
/* 视觉保持 38，热区撑到 46：iOS HIG 44 / Material 48 的触控下限，布局不变 */
.icon::after{content:'';position:absolute;inset:-4px}
.icon:active{background:#1b2530}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 6px}
#msgs{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.row{display:flex;flex-direction:column;max-width:100%}
.row.user{align-items:flex-end}
.row.assistant{align-items:flex-start}
.bubble{
  max-width:92%;padding:9px 13px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere;
  white-space:normal;
}
.row.user .bubble{background:var(--user);border-bottom-right-radius:5px}
.row.assistant .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;max-width:100%}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{font-size:15px;margin:10px 0 6px}
.bubble ul,.bubble ol{margin:6px 0;padding-left:20px}
.bubble li{margin:2px 0}
.bubble li.sub{margin-left:16px}
.bubble li.sub2{margin-left:32px}
.bubble li.sub3{margin-left:48px}
/* 任务列表：模型写计划常用 "- [ ]"，以前会把 "[ ]" 原样吐在正文里 */
.bubble ul.tasks{padding-left:20px}
.bubble li.task{list-style:none;margin-left:-18px}
.bubble li.task::before{content:'☐';color:var(--dim);margin-right:6px}
.bubble li.task.done{color:var(--dim)}
.bubble li.task.done::before{content:'☑';color:#4ea1ff}
.bubble hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.bubble blockquote{border-left:3px solid var(--acc-dim);margin:6px 0;padding:2px 10px;color:var(--dim)}
.bubble code{background:#1b2431;padding:1px 5px;border-radius:5px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bubble pre{background:#0a1017;border:1px solid var(--line);border-radius:10px;padding:10px;
  overflow-x:auto;margin:0;font-size:12.5px;line-height:1.45}
/* 代码块外层：给「复制」按钮一个不被横向滚动带走的定位基准。
   以前按钮是 pre 的子元素，pre 一横滚按钮就跟着跑到代码中间（实测滚 256px 后
   x 从 322 变 66）；而且 pre 的 innerText 会把按钮文字算进去，长按复制会多出「复制」两字。 */
.bubble .prewrap{position:relative;margin:8px 0}
.bubble pre code{background:none;padding:0}
.bubble pre[data-lang]{padding-top:23px}
.bubble pre[data-lang]::before{content:attr(data-lang);position:absolute;top:0;left:0;
  font-size:10px;color:#5b6b7d;background:#0f1720;padding:2px 9px;border-radius:9px 0 6px 0;
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);letter-spacing:.4px}
/* 单元格允许换行：以前是 nowrap，英文短值没问题，但中文长句也顶着不换 ——
   实测一张三列表格撑到 893px（视口 338），要横拖 555px 才看得完一行。 */
.bubble table{border-collapse:collapse;margin:8px 0;font-size:12.5px;display:block;
  overflow-x:auto;max-width:100%}
.bubble th,.bubble td{border:1px solid var(--line);padding:5px 9px;text-align:left;
  white-space:normal;word-break:break-word;min-width:84px;max-width:72vw}
.bubble th{background:#16202b;font-weight:600;color:#c3d2e0}
.bubble tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.bubble a{color:var(--acc)}
.bubble img{max-width:100%;border-radius:8px}
.meta{font-size:11px;color:var(--dim);margin:3px 4px 0}
.tool{
  font-size:12px;color:var(--dim);background:#0d141c;border:1px solid var(--line);border-radius:9px;
  margin:0 0 2px;max-width:100%;overflow:hidden;
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.tool .th{display:flex;align-items:center;gap:7px;padding:6px 9px;cursor:pointer}
.tool .th:active{background:#111a24}
.tool .arw{color:#55657a;flex:0 0 auto;transition:transform .15s}
.tool.open .arw{transform:rotate(90deg)}
.tool .tn{color:#9db2c8;flex:0 0 auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .tp{color:#5f7185;font-size:11px;flex:1 1 auto;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tool .ts{margin-left:auto;font-size:10.5px;color:#c99a2e;letter-spacing:.3px;flex:0 0 auto}
.tool.ok .ts{color:var(--ok)}
.tool .tb,.tool .tr{display:none;padding:0 9px 7px;white-space:pre-wrap;word-break:break-word;
  color:#7f8f9f;line-height:1.45;max-height:280px;overflow:auto}
.tool.open .tb,.tool.open .tr{display:block}
.tool .tr{border-top:1px dashed var(--line);padding-top:6px;margin-top:1px;color:#93a3b3}
.thinking{font-size:12px;color:var(--dim);font-style:italic;padding:2px 6px}
.cursor{display:inline-block;width:7px;height:14px;background:var(--acc);vertical-align:-2px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
footer{
  flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
  background:var(--bg2);border-top:1px solid var(--line);
}
#ta{
  flex:1;min-height:41px;max-height:132px;resize:none;/* 41 = 边框 2 + 上下内距 18 + 行高 21，
     一行内容正好放满：10px 内距时 clientHeight 39 < scrollHeight 41，空输入框也常驻一条
     竖向滚动条、末行还被切 2px。min-height 也要跟着改成 41，40 会再压掉 1px。 */
  padding:9px 12px;border-radius:14px;
  background:#0a1017;color:var(--fg);border:1px solid var(--line);font:inherit;line-height:1.4;outline:none;
}
#ta:focus{border-color:var(--acc-dim)}
#send{
  flex:0 0 auto;height:40px;padding:0 16px;border-radius:14px;background:var(--acc);color:#03111f;
  font-weight:600;font-size:14px;
}
#send:disabled{background:#22303d;color:var(--dim)}
.conn{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 62px);
  font-size:11px;padding:3px 10px;border-radius:99px;background:#1b2530;color:var(--dim);
  border:1px solid var(--line);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;
}
.conn.on{opacity:1}
.conn.bad{background:#3a1216;color:#f85149;border-color:#5a1a20}
/* 壳有新版本时压一条细带在 header 下面，点它去下 APK */
#upd{
  display:block;padding:6px 12px;text-align:center;font-size:12px;
  background:#0f2a1c;color:#5ee08a;border-bottom:1px solid #1d4030;
  text-decoration:none;
}
#upd b{font-weight:600}
#upd[hidden]{display:none}
.drawer{
  position:fixed;inset:0;background:rgba(4,7,10,.82);z-index:30;display:none;
  backdrop-filter:blur(3px);
}
.drawer.on{display:block}
.panel{
  position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 46px);
  background:var(--bg);border-top-left-radius:18px;border-top-right-radius:18px;
  display:flex;flex-direction:column;overflow:hidden;
}
.panel h2{margin:0;padding:14px 16px 10px;font-size:14px;color:var(--dim);font-weight:600;
  display:flex;align-items:center;justify-content:space-between}
#list{overflow-y:auto;padding:0 8px 16px}
.addrbox{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 12px 12px;background:var(--bg2)}
.addrbox .ah2{font-size:11px;color:var(--dim);margin:2px 0 4px}
.addrbox .u{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--acc);
  word-break:break-all;padding:4px 0;cursor:pointer}
.addrbox .u:active{opacity:.6}
.addrbox .stamp{font-size:10.5px;color:#6b7684;margin-top:4px}
.item{
  padding:11px 12px;border-radius:12px;margin:4px 0;background:var(--card);border:1px solid var(--line);
  display:flex;gap:10px;align-items:center;
}
.item:active{background:#1b2530}
.item .t{flex:1;min-width:0}
.item .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{font-size:11px;color:var(--dim);margin-top:2px}
.badge{font-size:10px;padding:1px 6px;border-radius:6px;background:#1b2530;color:var(--dim);flex:0 0 auto}
.badge.gui{background:#12324a;color:#7cc4ff}
.badge.feishu,.badge.telegram,.badge.qqbot{background:#13351f;color:#6ee7a0}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:13px}
#login{
  position:fixed;inset:0;background:var(--bg);z-index:50;display:none;
  align-items:center;justify-content:center;padding:24px;
}
#login.on{display:flex}
#login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
#login h1{font-size:18px;margin:0 0 6px}
#login input{padding:12px;border-radius:12px;border:1px solid var(--line);background:#0a1017;color:var(--fg);font:inherit}
#login button{padding:12px;border-radius:12px;background:var(--acc);color:#03111f;font-weight:600}
#login .err{color:var(--err);font-size:12px;min-height:16px}
/* --- session list v2 --- */
.search{padding:0 12px 8px}
.search input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
  background:#0a1017;color:var(--fg);font:inherit;font-size:14px;outline:none}
.search input:focus{border-color:var(--acc-dim)}
.grp{font-size:11px;color:var(--dim);font-weight:600;padding:12px 14px 4px;letter-spacing:.4px}
.item.cur{border-color:var(--acc-dim);background:#0f1c2a}
.item .del{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--dim);font-size:15px;flex:0 0 auto;border:1px solid transparent;position:relative}
/* 归档是破坏性操作，热区小容易点漏也容易误触 —— 撑到 46 */
.item .del::after{content:'';position:absolute;inset:-6px}
.item .del:active{background:#3a1216;color:var(--err);border-color:#5a1a20}
.more{text-align:center;color:var(--acc);font-size:13px;padding:14px}
/* --- chat extras --- */
#toBottom{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 74px);
  width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  display:none;place-items:center;z-index:15;color:var(--dim);font-size:16px}
#toBottom.on{display:grid}
#send.stop{background:var(--err);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 130px);
  background:#1b2530;color:var(--fg);padding:8px 16px;border-radius:10px;font-size:13px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;border:1px solid var(--line);max-width:80%}
.toast.on{opacity:1}
.cc{position:absolute;top:5px;right:5px;font-size:10px;padding:5px 9px;border-radius:6px;
  background:#1b2530;color:var(--dim);border:1px solid var(--line);opacity:.85}
/* 视觉 28×22，热区撑到 44：手指点得到，又不占代码的地方 */
.cc::after{content:'';position:absolute;inset:-8px}
.sep{text-align:center;font-size:11px;color:var(--dim);padding:8px 0 2px;opacity:.75}
#attaches{display:none;gap:8px;padding:8px 12px 0;overflow-x:auto;flex:0 0 auto}
#attaches.on{display:flex}
#attaches .thumb{position:relative;flex:0 0 auto;width:60px;height:60px;border-radius:10px;
  overflow:hidden;border:1px solid var(--line)}
#attaches img{width:100%;height:100%;object-fit:cover;display:block}
#attaches .thumb button{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.75);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center;padding:0}
#attaches .fu{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:6px;height:60px;
  max-width:180px;padding:0 26px 0 10px;border-radius:10px;border:1px solid var(--line);background:#0d141c}
#attaches .fu .fn{font-size:12px;line-height:1.25;word-break:break-all;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#attaches .fu .fs{font-size:10.5px;color:var(--dim)}
#attaches .fu button{position:absolute;top:2px;right:2px}
#btnImg,#btnFile{font-size:16px}
.bubble .filechip{font-size:12px;color:var(--fg,#dbe6f0);background:#0d141c;border:1px solid var(--line);
  border-radius:8px;padding:4px 9px;display:inline-block;margin:4px 0;word-break:break-all;max-width:100%}
/* ---------- 图片 ---------- */
.bubble img.hi{max-width:100%;height:auto;border-radius:10px;display:block;margin:6px 0;cursor:zoom-in;
  background:#0a1017}
.bubble img.hi.broken{display:none}
.bubble .imgmiss{font-size:11.5px;color:var(--dim);background:#0d141c;border:1px dashed var(--line);
  border-radius:8px;padding:5px 9px;display:inline-block;margin:4px 0;word-break:break-all}
/* 看图：默认整图适应屏幕；点一下切成原始尺寸（可拖动细看），再点回适应；
   点黑底关掉。以前是「点任意处就关」，而且只能缩小 —— 615 宽的图在 390 视口里被压到
   390，长截图更是按高度限死后只剩一百多像素宽，等于看不清。 */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:60;
  align-items:center;justify-content:center;overflow:auto}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;transition:transform .12s}
#lightbox.on.zoom{display:block;overflow:auto;-webkit-overflow-scrolling:touch}
#lightbox.on.zoom img{max-width:none;max-height:none;width:auto;height:auto;object-fit:fill;display:block}
#lightbox .x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:42px;height:42px;
  border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:20px;color:#fff}
#lightbox .x::after{content:'';position:absolute;inset:-6px}

/* ---------- 审批 ---------- */
#approve{flex:0 0 auto;margin:0 10px 6px;border:1px solid #5a3f00;background:#1d1608;border-radius:12px;
  overflow-y:auto;max-height:44vh;display:none}
#approve.on{display:block}
#approve .apv + .apv{border-top:1px solid #3a2c0a}
#approve .ah{display:flex;align-items:center;gap:7px;padding:9px 11px 6px;font-size:12px;color:#e0b34a}
#approve .ah b{color:#f0c75e;font-weight:600;flex:0 0 auto}
#approve .ah .n{margin-left:auto;font-size:11px;color:#a08a52}
#approve .ac{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#cdbd92;
  background:#120d04;margin:0 9px 8px;padding:7px 9px;border-radius:8px;max-height:110px;overflow:auto;
  white-space:pre-wrap;word-break:break-all;line-height:1.4}
#approve .ad{font-size:11.5px;color:#9c8a63;margin:0 11px 8px;line-height:1.4}
#approve .ab{display:flex;gap:6px;padding:0 9px 9px;flex-wrap:wrap}
#approve .ab button{font-size:12.5px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
  background:#1b2530;color:var(--fg);flex:1 1 0;min-width:0}
#approve .ab button.deny{background:#2a1316;border-color:#5c1f24;color:#ff9b96;flex:0 0 auto;padding:8px 16px}
#approve .ab button.ok{background:#12331c;border-color:#1f5c30;color:#7ee2a0}
#approve .cq{padding:0 11px 8px}
#approve .cin{flex:1 1 120px;min-width:0;background:var(--card);border:1px solid var(--line);
  border-radius:9px;color:var(--fg);font:inherit;font-size:13px;padding:8px 10px}
#approve .ab button:disabled{opacity:.45}

/* ---------- 失败重试 ---------- */
.row .retry{font-size:11.5px;color:#ff9b96;margin-top:4px;align-self:flex-end;
  border:1px solid #5c1f24;background:#2a1316;border-radius:8px;padding:4px 10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="icon" id="btnList" aria-label="会话列表">☰</button>
    <div class="ttl" id="ttlBox" title="点击切换模型"><span id="ttlMain">Hermes</span><span class="sub" id="ttlSub">连接中…</span></div>
    <button class="icon" id="btnReconn" aria-label="重连">⟳</button>
    <button class="icon" id="btnNew" aria-label="新对话">＋</button>
  </header>
  <a id="upd" href="hermes-mobile.apk" hidden>APK 有新版本 <b></b> · 点这里下载</a>
  <main id="scroll"><div id="msgs"></div></main>
  <div id="approve"></div>
  <div id="attaches"></div>
  <footer>
    <button id="btnFile" class="icon" aria-label="发送文件">📎</button>
    <button id="btnImg" class="icon" aria-label="发送图片">🖼</button>
    <textarea id="ta" rows="1" placeholder="说点什么…" autocomplete="off"></textarea>
    <button id="send" disabled>发送</button>
  </footer>
</div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="filePick" multiple hidden>
<div class="conn" id="conn"></div>
<button id="toBottom" aria-label="回到底部">↓</button>
<div class="toast" id="toast"></div>
<div id="lightbox"><button class="x" id="lbClose">×</button><img id="lbImg" alt=""></div>

<div class="drawer" id="drawer">
  <div class="panel">
    <h2><span>最近会话</span><button class="icon" id="closeDrawer">×</button></h2>
    <div class="search"><input id="q" placeholder="搜索会话…" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <div id="list"><div class="empty">加载中…</div></div>
    <div class="addrbox" id="addrBox"></div>
  </div>
</div>

<div class="drawer" id="modelDrawer">
  <div class="panel">
    <h2><span>选择模型</span><button class="icon" id="closeModel">×</button></h2>
    <div class="search"><input id="mq" placeholder="搜索模型…" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <div id="mlist"><div class="empty">加载中…</div></div>
  </div>
</div>

<div id="login">
  <form id="loginForm">
    <h1>Hermes · 手机端</h1>
    <div class="err" id="loginErr"></div>
    <input id="lu" placeholder="用户名" autocomplete="username">
    <input id="lp" type="password" placeholder="密码" autocomplete="current-password">
    <button type="submit">登录</button>
    <button type="button" id="btnRelogin">重新连接</button>
  </form>
</div>

<script>
(() => {
'use strict';

const $ = s => document.querySelector(s);
const scroll = $('#scroll'), msgsEl = $('#msgs'), ta = $('#ta'), sendBtn = $('#send');
const conn = $('#conn'), drawer = $('#drawer'), listEl = $('#list');
const qEl = $('#q'), toBottomEl = $('#toBottom'), toastEl = $('#toast');
const modelDrawer = $('#modelDrawer'), mlist = $('#mlist');
const mqEl = $('#mq');
const fileIn = $('#fileIn'), attaches = $('#attaches'), btnImg = $('#btnImg');
const filePick = $('#filePick'), btnFile = $('#btnFile');
const approveEl = $('#approve'), lightbox = $('#lightbox'), lbImg = $('#lbImg');
let pendingImgs = [];
let pendingFiles = [];   // {name, size, ref} —— ref 就是网关回的 @file:<path>，发送时前置到正文
// file.attach 走 WebSocket 里的 base64；服务端上限 256 MB，手机上内存先扛不住。
// 25 MB 的账：FileReader 先读成 dataURL（+33%），再塞进一帧 JSON 字符串（又一份），
// 峰值内存 ≈ 2.7 倍 —— 25 MB 的文件要吃掉 67 MB 堆，手机上很容易直接把 WebView 撑崩。
// 10 MB 是「PDF / ppt / 长视频截图够用」和「峰值 27 MB，标签页还活着」的分界。
// 要发更大的，走分片（网关有 /api/files/upload-stream），别在这条路上加内存。
const FILE_MAX = 10 * 1024 * 1024;
let toastTimer = null;
function toast(t){
  toastEl.textContent = t;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1800);
}

/* 上传指示：toast 1.8 秒就自己消失，而 10 MB 走 WebSocket 可能要十几秒 ——
   中间一点反馈都没有，用户会以为卡死。这里用每 0.5 秒刷新的 toast 撑住整段上传
   （toast() 每次调用都会重设隐藏定时器，所以一直不会消失）。 */
let upTickTimer = 0;
function uploadTick(label){
  const t0 = Date.now();
  clearInterval(upTickTimer);
  const paint = () => toast(label + ' · 已 ' + Math.round((Date.now() - t0) / 1000) + 's');
  paint();
  upTickTimer = setInterval(paint, 500);
  return () => { clearInterval(upTickTimer); upTickTimer = 0; };
}

let rafPending = false;
let unread = 0;
function syncUnread(){
  if (unread > 0 && !S.autoScroll){
    toBottomEl.textContent = '↓' + (unread > 99 ? '99+' : unread);
    toBottomEl.classList.add('on');
  } else {
    toBottomEl.textContent = '↓';
    if (S.autoScroll) toBottomEl.classList.remove('on');
  }
}
function haptic(ms){ try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch(e){} }

function fmtTok(n){
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

async function refreshUsage(){
  if (!S.sid) return null;
  try {
    const u = await rpc('session.usage', {session_id: S.sid}, 15000);
    S.usage = u || null;
    if (u && typeof u.output === 'number') S.lastOutput = u.output;
    syncSub();
    return u;
  } catch(e){ return null; }
}

const S = {
  ws: null, sid: null, storedId: null, title: '',
  rpcSeq: 0, pending: new Map(),
  cur: null,          // {row, body, text}
  think: null,
  streaming: false,
  autoScroll: true,
  authProbed: false,
  retries: 0,
  usage: null, lastOutput: 0, turnStart: 0,
  cap: false,         // client.capabilities 已声明
  approvals: new Map(),  // srq-id -> {el}
  lastFail: null,     // 上一条失败的用户消息 {text, row}
  lastFrameAt: 0,     // 最后一帧到达时刻（含 pong）——判僵尸 socket 用
  turnUserText: '',   // 本轮发出去的 payload（收尾时并进本地历史缓存）
  turnMedia: false,   // 本轮带了图片附件（@image 引用由服务端补，缓存拼不出来 → 不作数）
};

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 带超时的 fetch：手机上一次 fetch 卡住（地址黑洞 / 弱网 / 网关没起来）就会永不
// resolve，connect() 里的 connecting 标志跟着永远为 true —— 之后每次点「重新连接」
// 都走 if(connecting) return 直接返回，界面一动不动。这就是「点了没反应」。
function fetchT(url, opts, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 8000);
  return fetch(url, Object.assign({}, opts || {}, {signal: ctl.signal}))
    .finally(() => clearTimeout(timer));
}

/* ---------- 图片（历史里的 @image:<path> / [Image attached at: path]） ---------- */
const IMG_EXT = /\.(png|jpe?g|gif|webp|bmp)$/i;
function imgBase(p){
  const s = String(p || '').trim().replace(/^`+|`+$/g, '').replace(/^["']+|["']+$/g, '');
  const parts = s.split(/[\\/]/);
  return parts[parts.length - 1] || '';
}
// 图片尺寸记忆：第一次加载完就记住 naturalWidth/Height，下次渲染直接写进 width/height。
// 浏览器据此按真实比例预留空间 —— 图片晚到不会再把整页往下顶（实测 20 张图：加载前
// 每张高 0，加载后 45px，页面总高从 1718 变 2627）。只读本地记录，不发额外请求；
// 满了先丢最老的。第一次看新图仍会跳一次，之后就稳了。
const IMGDIM = (() => {
  const KEY = 'hermes.imgdim', MAX = 400;
  let M = {}, t = 0;
  try { M = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { M = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(M)); } catch (e) {} };
  // 一批图几乎同时到，攒 300ms 写一次；不用「攒够 N 条」那种计数，否则最后不满 N 条的
  // 那几张会一直留在内存里，用户直接关页面就白记了（实测 20 张只落 16 条）。
  const later = () => { clearTimeout(t); t = setTimeout(save, 300); };
  return {
    get: p => M[p] || '',
    set: (p, w, h) => {
      if (!p || !(w > 0) || !(h > 0)) return;
      const v = w + 'x' + h;
      if (M[p] === v) return;
      M[p] = v;
      const ks = Object.keys(M);
      if (ks.length > MAX) ks.slice(0, ks.length - MAX).forEach(k => { delete M[k]; });
      later();
    },
    flush: () => { clearTimeout(t); t = 0; save(); },
    // 调试/测试口：光删 localStorage 不够 —— 导航前 pagehide 会 flush，把内存里的旧值写回去
    clear: () => { clearTimeout(t); t = 0; M = {}; try { localStorage.removeItem(KEY); } catch (e) {} },
    size: () => Object.keys(M).length,
  };
})();

function imgTag(p){
  // 历史里的图片引用实测 95/95 都是绝对路径（"只有文件名"的 57 处全是文档占位符
  // <path> / <路径>，不是真引用）。所以直接走 /api/fs/download：
  //   - 要登录 cookie 才给字节，不再靠 assets/img 里那堆免鉴权硬链接（公网可枚举）；
  //   - 新图立刻可见，不用重启 link_images 重灌硬链接；
  //   - Content-Disposition: attachment 不影响 <img> 子资源（真 Chrome 实测 615×90 正常渲染）。
  const raw = String(p || '').trim().replace(/^`+|`+$/g, '').replace(/^["']+|["']+$/g, '')
                             .replace(/\\\\+/g, '\\');   // 防御：极少数行是双重转义存进去的
  const base = imgBase(raw);
  if (!base || base === '..' || base === '.' || !IMG_EXT.test(base)) {
    return '<span class="imgmiss">🖼 图片未同步</span>';
  }
  if (!/[\\/]/.test(raw)) return '<span class="imgmiss">🖼 图片未同步</span>';
  const d = IMGDIM.get(raw).split('x');
  const box = d.length === 2 ? ' width="' + d[0] + '" height="' + d[1] + '"' : '';
  return '<img class="hi"' + box + ' src="/api/fs/download?path=' + encodeURIComponent(raw) +
         '" alt="' + esc(base) + '" loading="lazy">';
}
// 非图片文件：网关只回 @file:<绝对路径>，手机端拿不到字节（文件在他电脑上），
// 所以渲染成一个「已附加」的条，不给下载链接 —— 别让用户点了以为能下
function fileTag(p){
  const s = String(p || '').trim().replace(/^`+|`+$/g, '').replace(/^["']+|["']+$/g, '');
  const base = (s.split(/[\\/]/).pop() || s);
  return '<span class="filechip">📎 ' + esc(base) + '</span>';
}
// 用户消息：纯文本 + 换行 + 图片，不套 markdown（避免把 * 之类当格式）
function userHTML(text){
  const imgs = [];
  const stash = h => { imgs.push(h); return '\u0000I' + (imgs.length - 1) + '\u0000'; };
  let s = String(text == null ? '' : text);
  s = s.replace(/\[Image attached at: ([^\]\n]+)\]/g, (m, p) => '\n' + stash(imgTag(p)) + '\n');
  s = s.replace(/@image:(?:`([^`\n]+)`|"([^"\n]+)"|'([^'\n]+)'|([^\s\n]+))/g,
    (m, a, b, c, d) => stash(imgTag(a || b || c || d)));
  s = s.replace(/@file:(?:`([^`\n]+)`|"([^"\n]+)"|'([^'\n]+)'|([^\s\n]+))/g,
    (m, a, b, c, d) => stash(fileTag(a || b || c || d)));
  s = s.replace(/\[screenshot\]/g, '').replace(/\[image\]/g, '\u0000IM\u0000');
  s = esc(s).replace(/\n/g, '<br>');
  s = s.replace(/(?:<br>)*\u0000I(\d+)\u0000(?:<br>)*/g, (m, n) => imgs[+n] || '');
  s = s.replace(/\u0000IM\u0000/g, '<span class="imgmiss">🖼 图片未同步</span>');
  return s.replace(/(?:\s*<br>\s*)+$/,'');
}
// 点击放大：默认适应屏幕，点一下图切成原始尺寸（可拖动细看），再点回适应；点黑底才关。
// 以前是「点任意处就关 + 只能缩小」，615 宽的图在 390 视口里被压成 390，长截图更只剩一百多像素宽。
msgsEl.addEventListener('click', ev => {
  const im = ev.target.closest && ev.target.closest('img.hi');
  if (!im) return;
  openLightbox(im.src);
});
let lbZoom = false;
function openLightbox(src){
  lbImg.src = src;
  lbZoom = false;
  lightbox.classList.remove('zoom');
  lightbox.classList.add('on');
  try { lightbox.scrollTop = 0; lightbox.scrollLeft = 0; } catch(e){}
}
function closeLightbox(){
  lightbox.classList.remove('on');
  lightbox.classList.remove('zoom');
  lbZoom = false;
  lbImg.removeAttribute('src');
}
lbImg.addEventListener('click', ev => {
  ev.stopPropagation();          // 别让它冒泡成「点黑底关掉」
  lbZoom = !lbZoom;
  lightbox.classList.toggle('zoom', lbZoom);
  if (lbZoom) { try { lightbox.scrollTop = 0; lightbox.scrollLeft = 0; } catch(e){} }
});
lightbox.addEventListener('click', closeLightbox);
// 加载失败 → 折叠成提示
// 记住真实尺寸，供 imgTag 下次预留空间。load 不冒泡，但捕获阶段能拿到。
msgsEl.addEventListener('load', ev => {
  const im = ev.target;
  if (!im || im.tagName !== 'IMG' || !im.classList || !im.classList.contains('hi')) return;
  const src = im.getAttribute('src') || '';
  const i = src.indexOf('path=');
  if (i < 0) return;
  let p = '';
  try { p = decodeURIComponent(src.slice(i + 5)); } catch (e) { return; }
  IMGDIM.set(p, im.naturalWidth, im.naturalHeight);
}, true);
msgsEl.addEventListener('error', ev => {
  const im = ev.target;
  if (!im || !im.classList || !im.classList.contains('hi')) return;
  im.classList.add('broken');
  if (!im.dataset.missed){
    im.dataset.missed = '1';
    const sp = document.createElement('span');
    sp.className = 'imgmiss';
    sp.textContent = '🖼 ' + (im.alt || '图片') + ' 未同步到手机端';
    im.insertAdjacentElement('afterend', sp);
  }
}, true);

function md(src){
  if (!src) return '';
  // 链接目标要看是不是在 APK 壳里：WebView 的 setSupportMultipleWindows 默认 true，
  // target="_blank" 走 onCreateWindow，而壳里没实现它 —— 链接会被直接丢弃，连
  // shouldOverrideUrlLoading 都到不了（那儿才是「站内留壳 / 外链交给系统浏览器」）。
  // 浏览器里反过来：必须 _blank，否则整页被导航走，当前会话就没了。
  // 放在函数里而不是模块级常量：verify_all 会把 md() 单独抽出来跑，抽不到外部常量。
  const A_TGT = (typeof window !== 'undefined' && window.HermesApp) ? '' : ' target="_blank"';
  const blocks = [];
  let s = String(src);
  // fenced code first
  s = s.replace(/```([\w+#.\-]*)\r?\n?([\s\S]*?)```/g, (m, lang, code) => {
    const lg = (lang || '').trim().toLowerCase();
    blocks.push('<pre' + (lg ? ' data-lang="' + esc(lg) + '"' : '') + '><code>' +
                esc(code.replace(/\s+$/, '')) + '</code></pre>');
    return '\u0000B' + (blocks.length - 1) + '\u0000';
  });
  // 图片：抽出成占位，避免被 esc 与后续 markdown 规则破坏
  const imgs = [];
  const stash = html => { imgs.push(html); return '\u0000I' + (imgs.length - 1) + '\u0000'; };
  s = s.replace(/\[Image attached at: ([^\]\n]+)\]/g, (m, p) => '\n' + stash(imgTag(p)) + '\n');
  s = s.replace(/@image:(?:`([^`\n]+)`|"([^"\n]+)"|'([^'\n]+)'|([^\s\n]+))/g,
    (m, a, b, c, d) => stash(imgTag(a || b || c || d)));
  // 非图片附件：@file:<path>（含反引号/引号包裹的带空格路径）
  s = s.replace(/@file:(?:`([^`\n]+)`|"([^"\n]+)"|'([^'\n]+)'|([^\s\n]+))/g,
    (m, a, b, c, d) => stash(fileTag(a || b || c || d)));
  s = s.replace(/\[image\]/g, () => stash('<span class="imgmiss">🖼 图片未同步</span>'));
  s = esc(s);
  // tables: header | --- | body
  s = s.replace(/^([ \t]*\|[^\n]*\|[ \t]*)\r?\n([ \t]*\|[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|[ \t]*)\r?\n((?:[ \t]*\|[^\n]*\|[ \t]*(?:\r?\n|$))*)/gm,
    (m, head, _sep, body) => {
      // 单元格切分不能把 `a | b` 里的竖线当分隔符：按反引号状态走一遍
      const cut = r => {
        const t = r.trim().replace(/^\|/, '').replace(/\|$/, '');
        const out = []; let cur = '', tick = false;
        for (let i = 0; i < t.length; i++){
          const ch = t[i];
          if (ch === '`'){ tick = !tick; cur += ch; }
          else if (ch === '|' && !tick){ out.push(cur.trim()); cur = ''; }
          else cur += ch;
        }
        out.push(cur.trim());
        return out;
      };
      const h = cut(head);
      if (!h.length) return m;
      const rows = body.split(/\r?\n/).map(x => x.trim()).filter(x => x && x.indexOf('|') >= 0);
      let t = '<table><thead><tr>' + h.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
      for (const r of rows){
        const cs = cut(r);
        t += '<tr>' + h.map((_, i) => '<td>' + (cs[i] || '') + '</td>').join('') + '</tr>';
      }
      return t + '</tbody></table>';
    });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
  s = s.replace(/(^|[\s(（])_([^_\n]+)_(?=$|[\s)）,.!?，。！？])/g, '$1<i>$2</i>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  // markdown 链接先用占位符抽走，否则下面的裸 URL 规则会把 href 里的地址再包一层 <a>。
  const links = [];
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s()]*(?:\([^\s()]*\)[^\s()]*)*)\)/g, (m, txt, url) => {
    links.push('<a href="' + url + '"' + A_TGT + ' rel="noreferrer">' + txt + '</a>');
    return '\u0000L' + (links.length - 1) + '\u0000';
  });
  // 裸 URL：模型经常直接吐地址，不套 markdown。
  // 只吃 RFC3986 允许的 ASCII：以前是 [^\s<>"'`]，中文紧贴着地址时会被整段吞进链接
  // （实测「https://a.com/a?b=1&c=2，完」→ href 里带着「，完」，点开 404，后面那截字还变成链接）。
  // 尾部标点照旧剥，但括号要配对 —— 维基那种 .../Foo_(bar) 的右括号是地址的一部分。
  s = s.replace(/(https?:\/\/[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+)/g, (m, url) => {
    let t = url;
    for (;;){
      const b = t;
      t = t.replace(/[.,;:!?'"]+$/, '');
      const close = (t.match(/\)/g) || []).length, open = (t.match(/\(/g) || []).length;
      if (t.slice(-1) === ')' && close > open) t = t.slice(0, -1);
      if (t === b) break;
    }
    if (t.length < 10) return m;
    return '<a href="' + t + '"' + A_TGT + ' rel="noreferrer">' + t + '</a>' + url.slice(t.length);
  });
  s = s.replace(/^#### (.+?)\s*#*$/gm, '<h3>$1</h3>').replace(/^### (.+?)\s*#*$/gm, '<h3>$1</h3>')
       .replace(/^## (.+?)\s*#*$/gm, '<h2>$1</h2>').replace(/^# (.+?)\s*#*$/gm, '<h1>$1</h1>');
  s = s.replace(/(?:^&gt;[ \t]?.*(?:\r?\n|$))+/gm, m => {
    const rows = m.replace(/\s+$/, '').split(/\r?\n/).map(l => l.replace(/^&gt;[ \t]?/, ''));
    return '<blockquote>' + rows.join('<br>') + '</blockquote>';
  });
  // ---- hr
  s = s.replace(/^[ \t]*(-{3,}|\*{3,}|_{3,})[ \t]*$/gm, '<hr>');
  // 缩进 → 层级。以前只有 sub / sub2 两档，三层以上的列表全塌成同一缩进（实测 4/6/8/12
  // 空格的条目 margin-left 全是 32px，层级信息直接丢了）。2 空一级、4 空两级、≥8 空三级。
  // 定义在函数体内：verify_all 把 md() 单独抽出来跑，模块级常量抽不到。
  const indCls = ind => ind.length >= 8 ? ' sub sub2 sub3' : ind.length >= 4 ? ' sub sub2' : ind.length >= 2 ? ' sub' : '';
  // 任务列表要排在普通 - 之前，否则 "- [ ] x" 会被当普通条目，字面量 [ ] 留在正文里。
  s = s.replace(/^([ \t]*)[-*][ \t]+\[([ xX])\][ \t]+(.+)$/gm,
    (m, ind, ck, t) => '<li class="task' + (ck === 'x' || ck === 'X' ? ' done' : '') + indCls(ind) + '">' + t + '</li>');
  // list items (unordered + ordered, 2-space indent = one visibly nested level)
  s = s.replace(/^([ \t]*)[-*][ \t]+(.+)$/gm,
    (m, ind, t) => '<li' + (indCls(ind) ? ' class="' + indCls(ind).trim() + '"' : '') + '>' + t + '</li>');
  // 有序列表要记住起始号：5. 6. 不写 start 会被渲染成 1. 2.
  s = s.replace(/^([ \t]*)(\d+)\.[ \t]+(.+)$/gm,
    (m, ind, num, t) => '<li class="o' + indCls(ind) + '" data-n="' + num + '">' + t + '</li>');
  s = s.replace(/(?:<li class="task[^"]*">[\s\S]*?<\/li>[ \t]*\r?\n?)+/g, m => '<ul class="tasks">' + m + '</ul>\n');
  s = s.replace(/(?:<li class="o[^"]*"[^>]*>[\s\S]*?<\/li>[ \t]*\r?\n?)+/g, m => {
    const f = m.match(/data-n="(\d+)"/);
    return '<ol' + (f && +f[1] > 1 ? ' start="' + f[1] + '"' : '') + '>' + m + '</ol>\n';
  });
  s = s.replace(/(?:<li(?: class="sub(?: sub2)?(?: sub3)?")?>[\s\S]*?<\/li>[ \t]*\r?\n?)+/g, m => '<ul>' + m + '</ul>\n');
  // paragraphs
  s = s.split(/\n{2,}/).map(p => {
    const t = p.trim();
    if (!t) return '';
    if (/^<(pre|ul|ol|h1|h2|h3|li|table|hr|blockquote|\u0000)/.test(t) || /\u0000B/.test(t)) return t;
    return '<p>' + t.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  s = s.replace(/\u0000B(\d+)\u0000/g, (m, i) => blocks[+i] || '');
  s = s.replace(/\u0000L(\d+)\u0000/g, (m, i) => links[+i] || '');
  s = s.replace(/\u0000I(\d+)\u0000/g, (m, i) => imgs[+i] || '');
  return s;
}

function nearBottom(){ return scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 120; }
function toBottom(force){ if (force || S.autoScroll) scroll.scrollTop = scroll.scrollHeight; }

function stamp(){ const d = new Date(); return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0'); }

function fmtTs(ts){
  if (!ts) return '';
  const d = new Date(ts * 1000), now = new Date();
  const hm = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (d.toDateString() === now.toDateString()) return hm;
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
}

function fmtSep(ts){
  const d = new Date(ts * 1000), now = new Date();
  const hm = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return hm;
  if (d.toDateString() === y.toDateString()) return '昨天 ' + hm;
  if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
}

/* ---------- 报错人话化 ---------- */
function friendlyErr(method, msg){
  const raw = String(msg == null ? '' : msg).trim();
  const m = raw.toLowerCase();
  if (!raw) return '出错了';
  if (/failed to fetch|networkerror|network error|load failed|net::err|err_internet|err_connection/.test(m))
    return '连不上电脑：确认电脑上 start.cmd 窗口还开着，手机和电脑在同一网络';
  if (/gateway is running a turn|already running|running a turn in this/.test(m))
    return '电脑端正在跑这一轮，等它跑完再发';
  if (/approval.*timeout|approval timed out/.test(m))
    return '审批等待超时，那条命令没有执行';
  if (/timed? ?out|超时/.test(raw))
    return '网关没响应（' + (method || 'RPC') + ' 超时），点「重发」再试一次';
  if (/not connected|未连接|websocket is not open/.test(raw))
    return '连接断了，正在自动重连…';
  if (/\b401\b|unauthoriz|forbidden|login required/.test(m))
    return '登录过期了，刷新页面重新登录';
  if (/\b429\b|rate limit/.test(m))
    return '请求太频繁，等几秒再发';
  if (/\b50[234]\b|bad gateway|temporarily unavailable/.test(m))
    return '网关暂时不可用，稍后重试';
  if (/payload too large|too large|413/.test(m))
    return '内容太大了，拆小一点再发';
  return raw;
}

/* ---------- message rendering ---------- */
/* 建一行但不挂到列表上：增量翻页要先把一段消息建成 DocumentFragment 再整体插入，
   挂载动作留给调用方（makeRow → 自己 appendChild / buildChunk → frag）。 */
function makeRow(role, html, meta){

function startAssistant(){
  if (S.cur) return S.cur;
  S.cur = addRow('assistant', '<span class="cursor"></span>', '');

  return S.cur;
}

/* 流式重绘：短回答每帧重跑 md() 很便宜（16 KB ≈ 0.35 ms，Node 实测），
   但长回答是 O(n²)——每帧全文重解析再重设 innerHTML，手机上会掉帧。
   超过 RENDER_BIG 字符改成 120 ms 一次，并用尾随定时器保证最后一帧不丢。 */
const RENDER_BIG = 8192, RENDER_MS = 120;
let renderTimer = 0, renderAt = 0;

function paintCur(){
  const c = S.cur;
  if (!c) return;
  c.body.innerHTML = md(c.text) + '<span class="cursor"></span>';
  if (nearBottom()) toBottom(true);
  else { unread++; syncUnread(); }
}

function appendAssistant(delta){
  const cur = startAssistant();
  cur.text += delta;
  if (cur.text.length > RENDER_BIG){
    if (renderTimer) return;
    const wait = Math.max(0, RENDER_MS - (Date.now() - renderAt));
    renderTimer = setTimeout(() => {
      renderTimer = 0; renderAt = Date.now();
      if (!rafPending) paintCur();
    }, wait);
    return;
  }
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; paintCur(); });
}

// 断线时把没说完的那半截收尾。不清的话 S.cur 和光标一直挂着，S.streaming 永远 true ——
// send() 第一行就静默 return，重连之后照样发不出去，界面上一点提示都没有。
function abortStream(why){
  if (renderTimer){ clearTimeout(renderTimer); renderTimer = 0; }
  if (S.think){ S.think.remove(); S.think = null; }
  const cur = S.cur;
  if (cur){
    if (cur.text){
      cur.body.innerHTML = md(cur.text);
      decorateCode(cur.body);
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = stamp() + ' · ' + (why || '已中断');
      cur.row.appendChild(m);
    } else if (cur.row.parentNode){ cur.row.remove(); }
  }
  S.cur = null; S.streaming = false; S.turnStart = 0;
  syncSub(); syncSendBtn();
}

function finishAssistant(finalText){
  if (renderTimer){ clearTimeout(renderTimer); renderTimer = 0; }   // 别让节流的尾帧在收尾后又补一次
  const cur = S.cur || startAssistant();
  if (S.think){ S.think.remove(); S.think = null; }
  if (typeof finalText === 'string' && finalText.length) cur.text = finalText;
  if (!cur.text){ if (cur.row.parentNode) cur.row.remove(); S.cur = null; S.streaming = false; setSendEnabled(true); return; }
  cur.body.innerHTML = md(cur.text);
  decorateCode(cur.body);

  const dt = S.turnStart ? (Date.now() - S.turnStart) / 1000 : 0;
  let metaEl;
  if (cur.row.lastChild && cur.row.lastChild.className === 'meta') metaEl = cur.row.lastChild;
  else { metaEl = document.createElement('div'); metaEl.className = 'meta'; cur.row.appendChild(metaEl); }
  const baseMeta = stamp() + (dt ? ' · ' + dt.toFixed(1) + 's' : '');
  metaEl.textContent = baseMeta;

  S.cur = null; S.think = null; S.streaming = false;
  S.turnStart = 0;
  setSendEnabled(true);
  scrollEnd();

  // token/tps fills in once the server's usage counters settle
  if (dt > 0 && S.sid){
    const before = S.lastOutput || 0;
    const genS = S.firstDeltaAt ? (Date.now() - S.firstDeltaAt) / 1000 : 0;
    rpc('session.usage', {session_id: S.sid}, 15000).then(u => {
      const out = Number(u && u.output) || 0;
      const delta = Math.max(0, out - before);
      S.lastOutput = out;
      S.usage = u || null;
      const tps = (genS > 0.25 && delta > 0) ? (delta / genS) : 0;
      metaEl.textContent = baseMeta +
        (delta ? ' · ' + delta + ' tok' : '') +
        (tps ? ' · ' + (tps >= 10 ? tps.toFixed(0) : tps.toFixed(1)) + ' tok/s' : '');
      syncSub();
    }).catch(() => {});
  }
  // 本轮落地：把 user+assistant 并进本地历史缓存。少了这一步，手机上聊一轮就等于
  // 把这份缓存作废（message_count 变了、缓存的 n 没变），下次进来又拉一遍全量。
  rememberTurn(S.turnUserText, cur.text, S.turnMedia);
  S.turnUserText = ''; S.turnMedia = false;
  S.firstDeltaAt = 0;
}

function scrollEnd(){ setTimeout(() => toBottom(true), 30); }

/* attach a copy button to every <pre> code block inside root */
function decorateCode(root){
  if (!root || !root.querySelectorAll) return;
  const blocks = root.querySelectorAll('pre:not([data-cc])');
  for (const pre of blocks){
    pre.setAttribute('data-cc', '1');
    // 包一层 .prewrap，按钮挂在外层：pre 横向滚动时按钮不动，pre 的 innerText 也不含「复制」
    const wrap = document.createElement('div');
    wrap.className = 'prewrap';
    if (pre.parentNode) {
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
    }
    const b = document.createElement('button');
    b.className = 'cc';
    b.textContent = '复制';
    b.onclick = e => {
      e.stopPropagation();
      const code = pre.querySelector('code');
      copyText((code || pre).innerText || '');
    };
    wrap.appendChild(b);
  }
}

  const one = v => (typeof v === 'string' ? v : JSON.stringify(v));
