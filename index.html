/* ---------- rpc ---------- */
function rpc(method, params, timeoutMs){
  return new Promise((resolve, reject) => {
    if (!S.ws || S.ws.readyState !== 1) return reject(new Error('未连接'));
    const id = ++S.rpcSeq;
    const to = setTimeout(() => {
      if (S.pending.has(id)) { S.pending.delete(id); reject(new Error('超时: ' + method)); }
    }, timeoutMs || 30000);
    S.pending.set(id, {resolve, reject, to});
    S.ws.send(JSON.stringify({jsonrpc:'2.0', id, method, params: params || {}}));
  });
}

async function wsTicket(){
  const r = await fetchT('/api/auth/ws-ticket', {method:'POST', credentials:'same-origin'}, 10000);
  if (!r.ok) throw new Error('ticket ' + r.status);
  return (await r.json()).ticket;
}

/* ---------- 审批：server→client request ---------- */
const APV_LABEL = {once:'批准', session:'本会话都批准', always:'总是批准', deny:'拒绝'};
const APV_CLS = {once:'ok', session:'', always:'', deny:'deny'};

function apvFind(id){
  if (!id) return null;
  return Array.from(approveEl.children).find(x => x.dataset.id === id) || null;
}
function hideApproval(id){
  const el = apvFind(id);
  if (el) el.remove();
  if (!approveEl.children.length) approveEl.classList.remove('on');
}
function clearApprovals(){
  approveEl.innerHTML = '';
  approveEl.classList.remove('on');
}

// clarify：agent 在问你。原来这里一律回 -32601，模型收到的是 outcome:"cancelled"
// （= 你主动取消了），于是自己拍板往下走 —— 等于手机端把提问吞了。
function showClarify(id, p){
  if (!approveEl) return;
  const qs = Array.isArray(p && p.questions) ? p.questions : [];
  if (!qs.length) return;
  const key = String(id);
  if (apvFind(key)) return;
  const answers = {};
  let left = qs.length;
  const el = document.createElement('div');
  el.className = 'apv';
  el.dataset.id = key;
  el.innerHTML = '<div class="ah"><b>❓ 需要你回答</b><span class="n">' + qs.length + ' 个问题</span></div>';
  const finish = () => {
    if (left > 0) return;
    try {
      if (S.ws && S.ws.readyState === 1){
        S.ws.send(JSON.stringify({jsonrpc:'2.0', id: id,
          result: {answers: answers, outcome: 'submitted'}}));
      }
    } catch(e){}
    hideApproval(key);
  };
  qs.forEach((q, i) => {
    const qid = q.qid || ('q' + i);
    const box = document.createElement('div');
    box.className = 'cq';
    const t = document.createElement('div');
    t.className = 'ad';
    t.textContent = String(q.question || '(无题面)');
    box.appendChild(t);
    const bar = document.createElement('div');
    bar.className = 'ab';
    const settle = val => {
      if (box.dataset.done) return;
      box.dataset.done = '1';
      answers[qid] = val;
      left--;
      for (const b of bar.querySelectorAll('button')) b.disabled = true;
      if (q.multi_select) toast('多选只记了第一项');
      finish();
    };
    const choices = Array.isArray(q.choices) ? q.choices : [];
    if (choices.length){
      for (const c of choices){
        const b = document.createElement('button');
        b.textContent = String(c);
        b.onclick = () => settle(String(c));
        bar.appendChild(b);
      }
    } else {
      const inp = document.createElement('input');
      inp.className = 'cin';
      inp.placeholder = '输入回答…';
      const go = document.createElement('button');
      go.className = 'ok';
      go.textContent = '回答';
      go.onclick = () => { const v = String(inp.value || '').trim(); if (v) settle(v); };
      bar.appendChild(inp); bar.appendChild(go);
    }
    box.appendChild(bar);
    el.appendChild(box);
  });
  approveEl.appendChild(el);
  approveEl.classList.add('on');
  haptic(18);
}

function showApproval(id, p){
  if (!approveEl) return;
  p = p || {};
  const rid = p.request_id || p.requestId || '';
  const key = id || ('r:' + rid);
  if (!key || key === 'r:') return;
  if (apvFind(key)) return;   // 已显示
  const cmd = String(p.command || p.description || '(命令)');
  const desc = (p.description && String(p.description) !== cmd) ? String(p.description) : '';
  const choices = (Array.isArray(p.choices) && p.choices.length) ? p.choices : ['once','session','always','deny'];
  let h = '<div class="ah"><b>⚠ 需要你批准</b><span class="n">' +
          esc(String(p.surface || '工具调用')) + '</span></div>' +
          '<div class="ac">' + esc(cmd) + '</div>' +
          (desc ? '<div class="ad">' + esc(desc) + '</div>' : '') + '<div class="ab">';
  for (const c of choices){
    h += '<button class="' + (APV_CLS[c] || '') + '" data-c="' + esc(c) + '">' +
         (APV_LABEL[c] || esc(c)) + '</button>';
  }
  h += '</div>';
  const el = document.createElement('div');
  el.className = 'apv';
  el.dataset.id = key;
  el.dataset.rid = rid;
  el.innerHTML = h;
  el.addEventListener('click', ev => {
    const b = ev.target.closest && ev.target.closest('button[data-c]');
    if (!b) return;
    respondApproval(key, b.dataset.c);
  });
  approveEl.appendChild(el);
  approveEl.classList.add('on');
  haptic(30);
}

async function respondApproval(key, choice){
  const el = apvFind(key);
  if (el) el.querySelectorAll('button').forEach(b => b.disabled = true);
  const rid = el ? el.dataset.rid : '';
  const srq = (key.indexOf('r:') === 0) ? '' : key;
  hideApproval(key);   // 乐观移除：不让按钮卡在「已点但没反应」
  haptic(18);
  if (srq && S.ws && S.ws.readyState === 1){
    try { S.ws.send(JSON.stringify({jsonrpc:'2.0', id: srq, result:{choice}})); return; } catch(e){}
  }
  if (rid && S.sid){
    try {
      await rpc('approval.respond', {session_id: S.sid, choice, request_id: rid}, 15000);
      return;
    } catch(e){
      toast('回复审批失败：' + friendlyErr('approval.respond', e.message));
      return;
    }
  }
  toast('审批没发出去：连接断了，等重连后它会自己回来');
}

// 服务器→客户端请求入口
function handleServerRequest(fr){
  const m = fr.method, p = fr.params || {};
  if (m === 'approval'){
    if (!S.sid || !p.session_id || p.session_id === S.sid) showApproval(fr.id, p);
    else showApproval(fr.id, p);  // 网关只发给本会话，收下即可
    return;
  }
  if (m === 'clarify'){ showClarify(fr.id, p); return; }
  // 其余（sudo / 密钥 / 预览等）手机端不处理：立刻回 -32601，后端会快速撤回而不是干等超时
  try {
    if (S.ws && S.ws.readyState === 1){
      S.ws.send(JSON.stringify({jsonrpc:'2.0', id: fr.id,
        error:{code:-32601, message:'mobile client does not handle ' + m}}));
    }
  } catch(e){}
}

// resume / activate 快照里的未答请求
function replayServerRequests(res){
  if (!res) return;
  const oq = res.open_requests;
  if (Array.isArray(oq)){
    for (const r of oq){
      if (!r || !r.id) continue;
      if (r.method === 'approval') showApproval(r.id, r.params || {});
      else if (r.method === 'clarify') showClarify(r.id, r.params || {});
    }
  }
  // 请求帧丢失但队列里还有：按 request_id 兜底
  const pa = res.pending_approval;
  if (pa && pa.request_id){
    const has = Array.from(approveEl.children).some(x => x.dataset.rid === pa.request_id);
    if (!has) showApproval('', pa);
  }
}

async function openWs(){
  const ticket = await wsTicket();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  await new Promise((resolve, reject) => {
    const ws = new WebSocket(proto + '://' + location.host + '/api/ws?ticket=' + encodeURIComponent(ticket));
    S.ws = ws;
    // 三个 handler 都先认身份：手点「重新连接」或超时重建时，旧 socket 的 close 会晚到一步，
    // 不认身份它就会把 S.ws 置空（新 socket 明明连着，页面却以为断了、rpc 全 reject），
    // 旧 socket 迟到的帧也会被当成当前会话的事件画出来。
    ws.onopen = () => {
      if (S.ws !== ws) return;
      S.retries = 0;
      reconnTries = 0;
      S.lastFrameAt = Date.now();
      setSendEnabled(true);
      setConn('已连接');
      setTimeout(() => setConn(''), 1200);
      syncSub();
      // 声明本客户端能回答 server→client 请求（审批）。不发这条，网关会直接放弃推送审批。
      rpc('client.capabilities', {server_requests: true}, 10000)
        .then(r => { S.cap = true; }).catch(() => { S.cap = false; });
      resolve();
    };
    ws.onclose = () => {
      if (S.ws !== ws) return;
      abortStream('连接中断');      // 先把流式状态收干净，再关发送键
      setSendEnabled(false);
      setConn('断线，重连中…', true);
      S.ws = null;
      S.cap = false;
      clearApprovals();
      scheduleReconnect();
    };
    ws.onerror = () => { try { ws.close(); } catch(e){} };
    ws.onmessage = ev => {
      if (S.ws !== ws) return;
      S.lastFrameAt = Date.now();   // 任何一帧都算活着（含 gateway.ping 的 pong）
      let fr; try { fr = JSON.parse(ev.data); } catch(e){ return; }
      if (fr.id != null && S.pending.has(fr.id)){
        const p = S.pending.get(fr.id); S.pending.delete(fr.id); clearTimeout(p.to);
        if (fr.error) p.reject(new Error(fr.error.message || JSON.stringify(fr.error)));
        else p.resolve(fr.result || {});
        return;
      }
      // 服务器→客户端请求（有 id、有 method）——不是我们发的，是后端在问
      if (fr.method && fr.id != null){ handleServerRequest(fr); return; }
      const params = fr.params || {};
      if (fr.method === 'event' || params.type) onEvent(params);
    };
    setTimeout(() => { if (ws.readyState !== 1) reject(new Error('握手超时')); }, 12000);
  });
}

function syncSub(){
  $('#ttlMain').textContent = S.title || 'Hermes';
  let sub;
  if (S.streaming) sub = '回复中…';
  else if (S.storedId) sub = '已接续电脑端会话';
  else sub = '点 ☰ 选一个会话';
  const u = S.usage || {};
  const bits = [];
  if (u.model) bits.push(u.model);
  if (u.total) bits.push(fmtTok(u.total) + ' tok');
  if (u.avg_tps) bits.push((u.avg_tps >= 10 ? Math.round(u.avg_tps) : u.avg_tps.toFixed(1)) + ' tok/s');
  if (bits.length) sub = bits.join(' · ');
  $('#ttlSub').textContent = sub;
}

/* ---------- events ---------- */
function onEvent(p){
  const t = p.type, d = p.payload || {};
  // 带 session_id 的事件只画当前会话的。以前条件里带 S.sid：S.sid 还没落（没开会话 /
  // resume 失败）时任何会话的事件都放行 —— 后台 cron 或电脑端正在跑的那条会把内容
  // 流进这块空屏。全局事件（sessions.changed / session.title）例外。
  if (p.session_id && t !== 'session.title' && t !== 'sessions.changed' && p.session_id !== S.sid) return;
  switch(t){
    case 'message.start': S.streaming = true; S.turnStart = Date.now(); S.firstDeltaAt = 0; syncSendBtn(); if (S.think) { S.think.remove(); S.think = null; } startAssistant(); break;
    case 'message.delta': if (!S.firstDeltaAt) S.firstDeltaAt = Date.now(); if (typeof d.text === 'string') appendAssistant(d.text); break;
    case 'message.interim': if (typeof d.text === 'string') { const c = startAssistant(); c.body.innerHTML = md(d.text); } break;
    case 'message.complete': finishAssistant(d.text); S.streaming = false; syncSendBtn(); syncSub(); break;
    case 'thinking.delta':
    case 'reasoning.delta': thinkTick(); break;
    case 'tool.start': startTool(d); break;
    case 'tool.complete': doneTool(d); break;
    case 'status.update': if (d.text) flashConn(d.text, false); break;
    case 'session.title': if (d.title && (!S.sid || p.session_id === S.sid)) { S.title = d.title; syncSub(); } break;
    case 'request.cancel': if (d.id) hideApproval(String(d.id)); break;
    case 'error': flashConn(friendlyErr('', d.message || '出错了'), true);
      // 必须把半截气泡收尾：以前只改两个标志位，S.cur 还挂着，下一轮 message.start
      // 拿到的还是同一个气泡 → 新回答直接拼进上一轮那半截里，中间连分隔都没有。
      abortStream('出错了'); break;
    case 'sessions.changed': onSessionsChanged(); break;
  }
}

/* ---------- sessions ---------- */

// 网关广播 sessions.changed（state.db 动了）时静默对一次账：
// 不弹 loading、不打断滚动，抽屉开着就原地重绘
let sessionsSyncTimer = 0, sessionsSyncing = false, sessionsQueued = false;
async function refreshSessions(){
  // 正在拉的时候又来一次，别直接丢掉：sessions.changed 的防抖只给一次机会，
  // 丢掉就等于这次改动永远看不到（session.list 在慢机器上要十几秒）。
  if (sessionsSyncing){ sessionsQueued = true; return; }
  if (!S.ws || S.ws.readyState !== 1) return;
  sessionsSyncing = true;
  try {
    const r = await rpc('session.list', {limit: 200}, 20000);
    const rows = (r.sessions || r.rows || []).filter(x => x && x.id);
    if (!rows.length) return;
    ALL = rows;
    if (drawer.classList.contains('on')){
      const top = listEl.scrollTop;
      renderList();
      listEl.scrollTop = top;
    }
  } catch(e){}
  finally {
    sessionsSyncing = false;
    if (sessionsQueued){ sessionsQueued = false; setTimeout(refreshSessions, 0); }
  }
}
function onSessionsChanged(){
  if (sessionsSyncTimer) return;
  sessionsSyncTimer = setTimeout(() => { sessionsSyncTimer = 0; refreshSessions(); }, 1500);
}

function relTime(ts){
  if (!ts) return '';
  const now = Date.now()/1000, d = now - ts;
  if (d < 90) return '刚刚';
  if (d < 3600) return Math.round(d/60) + ' 分钟前';
  if (d < 86400) return Math.round(d/3600) + ' 小时前';
  if (d < 86400*7) return Math.round(d/86400) + ' 天前';
  const dt = new Date(ts*1000);
  return (dt.getMonth()+1) + '/' + dt.getDate();
}

const SRC_LABEL = {gui:'电脑端', desktop:'电脑端', local:'终端', cli:'终端', tui:'终端',
  feishu:'飞书', telegram:'TG', discord:'Discord', qqbot:'QQ', cron:'定时', webhook:'钩子'};

let ALL = [], Q = '', SHOWN = 60;
let SHOW_CRON = false;   // 定时任务(cron)会话默认不出现在列表里

// 抽屉里的日期分组标题已删（见 renderList）：行里没有 updated_at，分组只能拿
// started_at 硬凑，和「最近活动序」对不上。要恢复分组，得先让 session.list 带上
// 最后一次活动时间 —— 那是网关契约的改动，别在页面上编。

async function loadSessions(){
  if (!ALL.length) listEl.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const res = await rpc('session.list', {limit: 200}, 25000);
    ALL = (res.sessions || res.rows || []).filter(r => r && r.id);
    if (!ALL.length){ listEl.innerHTML = '<div class="empty">还没有会话</div>'; return; }
    renderList();
  } catch (e){
    listEl.innerHTML = '<div class="empty">读取失败：' + esc(friendlyErr('session.list', e.message)) + '</div>';
  }
}

function renderList(){
  const q = Q.trim().toLowerCase();
  const noCron = SHOW_CRON ? ALL : ALL.filter(r => (r.source || '') !== 'cron');
  const hiddenCron = ALL.length - noCron.length;
  // 空会话(0 条消息)不显示，但当前打开的那个除外
  const pool = noCron.filter(r => (r.message_count || 0) > 0 || r.id === S.storedId);
  const rows = (q ? pool.filter(r => {
    const hay = ((r.title || '') + ' ' + (r.preview || '') + ' ' +
                 (r.display_name || '') + ' ' + (r.source || '')).toLowerCase();
    return hay.indexOf(q) >= 0;
  }) : pool).slice();
  // 不排序：网关的 list_sessions_rich(order_by_last_active=True) 已经按「最近活动」排好，
  // 而 session.list 的行里根本没有 updated_at（字段只有 id/message_count/preview/source/started_at/title），
  // 照着 updated_at||started_at 再排一次等于改成按创建时间，会把刚聊过的会话压下去。
  if (!rows.length){
    listEl.innerHTML = '<div class="empty">' +
      (q ? '没有匹配「' + esc(Q) + '」的会话' : '还没有会话') + '</div>';
    return;
  }
  const cut = q ? rows.length : Math.min(SHOWN, rows.length);
  listEl.innerHTML = '';
  const cronTotal = ALL.length - ALL.filter(r => (r.source || '') !== 'cron').length;
  if (cronTotal && !q){
    const tip = document.createElement('div');
    tip.className = 'more';
    tip.textContent = SHOW_CRON
      ? '显示全部（含 ' + cronTotal + ' 个定时任务）· 点这里只看对话'
      : '已隐藏 ' + cronTotal + ' 个定时任务 · 点这里显示全部';
    tip.onclick = () => { SHOW_CRON = !SHOW_CRON; SHOWN = 60; renderList(); };
    listEl.appendChild(tip);
  }
  // 不再插日期分组标题：列表顺序是「最近活动」，而 session.list 的行里没有
  // updated_at（字段只有 id/message_count/preview/source/started_at/title），
  // 拿 started_at 分组等于按创建时间切 —— 实测第 0..6 行是 11-19 / 11-20 / 09-22 /
  // 11-15 / 09-21，组标题会 11月→今天→9月→11月 来回跳。每条 item 自己带相对时间，
  // 分组标题纯属噪音，删掉。
  for (let i = 0; i < cut; i++){
    const r = rows[i];
    const el = document.createElement('div');
    el.className = 'item' + (r.id === S.storedId ? ' cur' : '');
    const src = r.source || r.created_source || '';
    const nm = (r.title || r.display_name || r.preview || '(未命名)').toString().slice(0, 80);
    el.innerHTML = '<div class="t"><div class="n">' + esc(nm) + '</div><div class="d">' +
      esc(relTime(r.updated_at || r.started_at)) + ' · ' + (r.message_count || 0) + ' 条</div></div>' +
      '<span class="badge ' + esc(src) + '">' + esc(SRC_LABEL[src] || src || '会话') + '</span>';
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = '归档';
    del.onclick = ev => { ev.stopPropagation(); archiveSession(r, nm); };
    el.appendChild(del);
    el.onclick = () => { drawer.classList.remove('on'); openSession(r); };
    listEl.appendChild(el);
  }
  if (!q && rows.length > cut){
    const m = document.createElement('div');
    m.className = 'more';
    m.textContent = '显示更多（还有 ' + (rows.length - cut) + ' 个）';
    m.onclick = () => { SHOWN += 80; renderList(); };
    listEl.appendChild(m);
  }
}

async function archiveSession(r, nm){
  const label = (nm || r.id).toString().slice(0, 40);
  if (!confirm('归档「' + label + '」？\n\n从列表移除，消息记录保留，不会删除。')) return;
  try {
    await rpc('session.archive', {session_id: r.id, archived: true}, 15000);
    ALL = ALL.filter(x => x.id !== r.id);
    if (r.id === S.storedId) S.storedId = null;
    renderList();
    toast('已归档');
  } catch (e){
    toast('归档失败：' + e.message);
  }
}

/* ---------- 会话历史本地缓存 ----------
   网关的 session.history 不支持分页（实测传 limit:50/200 都被忽略，直接回 0 条），
   839 条的会话一次要拉 866 KB，resume+history 1.7~4.4 s，手机走 Wi-Fi 更久。
   所以开过的会话在 IndexedDB 里留一段尾巴：点进去先用它渲染，真数据回来再覆盖。
   只存文本（最近 400 条，够 renderHistory 的 160 条再留余量），最多 8 个会话，LRU。 */
const HCACHE = (() => {
  const DB = 'hermes-mobile', STORE = 'hist', VER = 1, MAX_MSGS = 600, MAX_SESS = 8;
  const idb = (typeof window !== 'undefined' && window.indexedDB) || null;   // DOM shim 里没有 → 整段自动降级
  let dbp = null;
  function open(){
    if (!idb) return Promise.resolve(null);
    if (dbp) return dbp;
    dbp = new Promise(res => {
      let req;
      try { req = idb.open(DB, VER); } catch(e){ return res(null); }
      req.onupgradeneeded = () => { const d = req.result; if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
      req.onblocked = () => res(null);
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(d => {
      if (!d) return null;
      return new Promise(res => {
        let out = null;
        try {
          const t = d.transaction(STORE, mode);
          const r = fn(t.objectStore(STORE));
          if (r) r.onsuccess = () => { out = r.result; };
          t.oncomplete = () => res(out);
          t.onerror = () => res(null);
          t.onabort = () => res(null);
        } catch(e){ res(null); }
      });
    });
  }
  function tail(list){
    return (list || [])
      .filter(m => m && (m.role === 'user' || m.role === 'assistant'))
      .slice(-MAX_MSGS)
      .map(m => ({ role: m.role,
                   text: typeof m.text === 'string' ? m.text : (typeof m.content === 'string' ? m.content : ''),
                   timestamp: m.timestamp || 0 }))
      .filter(m => m.text);
  }
  async function keys(){ return (await tx('readonly', s => s.getAllKeys())) || []; }
  return {
    async get(key){ const v = await tx('readonly', s => s.get(key)); return (v && v.msgs && v.msgs.length) ? v : null; },
    async put(key, list, n){
      const msgs = tail(list);
      if (!msgs.length) return;
      // n = 写这份缓存时 session.list 给的 message_count；下次点数一样就不必再拉全量
      await tx('readwrite', s => s.put({ t: Date.now(), msgs, n: n || 0 }, key));
      const ks = await keys();
      if (ks.length > MAX_SESS){
        const ages = [];
        for (const k of ks){
          const v = await tx('readonly', s => s.get(k));
          ages.push({ k, t: (v && v.t) || 0 });
        }
        ages.sort((a, b) => a.t - b.t);
        for (const it of ages.slice(0, ages.length - MAX_SESS)) await tx('readwrite', s => s.delete(it.k));
      }
    }
  };
})();

let openSeq = 0;   // 快速连点会话时，别让先发后到的旧响应盖掉新开的会话

/* 缓存能不能顶替这次全量拉取：条数信号一致就算命中。
   老缓存没有 n 字段（命中不了）、会话一条消息都没有（sig=0）都不算命中。 */
function cacheHitFor(rec, row){
  const sig = (row && row.message_count) || 0;
  return !!(rec && rec.n && sig && rec.n === sig);
}
async function openSession(row){
  const seq = ++openSeq;
  clearMsgs();
  S.storedId = row.id; S.sid = null; S.title = row.title || row.display_name || '';
  try { localStorage.setItem('hermes.session', row.id); } catch(e){}
  loadDraft();          // 切会话就换草稿（旧会话那份已经由 input 事件存进它自己的 key）
  $('#ttlMain').textContent = S.title || '会话';
  $('#ttlSub').textContent = '载入中…';
  setSendEnabled(false);
  // 先画缓存，别让人盯着空屏等 resume + 全量 history
  let cacheRec = null;
  try {
    cacheRec = await HCACHE.get(row.id);
    if (seq !== openSeq) return;
    if (cacheRec){
      renderHistory(cacheRec.msgs);
      scrollEnd();
      $('#ttlSub').textContent = '缓存 ' + relTime(cacheRec.t / 1000) + ' · 同步中…';
    }
  } catch(e){}
  // 缓存里记过「写它时这个会话有多少条」。session.list 的点数没变 = 没有新消息，别拉全量。
  // （实测 session.list 的 message_count 在 resume/history 前后都是同一个值，不会因为会话变 live 而跳。）
  const sig = row.message_count || 0;
  const cacheHit = cacheHitFor(cacheRec, row);
  try {
    const res = await rpc('session.resume', {
      session_id: row.id, source: 'tui', inline_images: false, defer_history: true
    }, 60000);
    if (seq !== openSeq) return;
    S.sid = res.session_id || null;
    if (res.info && res.info.title) { S.title = res.info.title; }
    replayServerRequests(res);
    if (cacheHit){
      // 命中：界面上已经是这份尾巴了，不再拉 1 MB 的 history。
      // 顺手核一次列表（26 KB / ~100 ms）：点数真变了再补拉，别把新消息藏起来。
      syncSub(); setSendEnabled(true); refreshUsage();
      loadSessions().then(() => {
        if (seq !== openSeq) return;
        const now = (ALL.find(x => x.id === row.id) || {}).message_count || 0;
        if (now && now !== sig) return pullHistory(row.id, seq);
      }).catch(() => {});
      return;
    }
    await pullHistory(row.id, seq);
  } catch (e){
    if (seq !== openSeq) return;
    $('#ttlSub').textContent = '载入失败';
    flashConn('载入失败：' + friendlyErr('session.resume', e.message), true);
    setSendEnabled(!!S.sid);
  }
}

/* 拉一次全量历史并落缓存。openSession、重连补拉、开机都走这里，别各写一份。 */
async function pullHistory(rowId, seq){
  const h = await rpc('session.history', {session_id: S.sid || rowId}, 60000);
  if (seq !== openSeq) return;
  renderHistory(h.messages || [], true);   // 同会话补拉：别把已经翻开的深度缩回 160
  histPullCount++;                          // 只读计数：测试靠它判断「还有没有在飞的全量」
  syncSub();
  // n 用服务端回的 count，不用 ALL 里那份 message_count —— ALL 可能是几分钟前拉的，
  // 电脑端刚聊过就是过期值；记下一个偏小的 n 会让这份缓存「永远」命中不了。
  const n = Number(h && h.count) || ((ALL.find(x => x.id === rowId) || {}).message_count || 0);
  HCACHE.put(rowId, h.messages || [], n);   // 不 await：慢的存储别拖住界面
  setSendEnabled(true);
  scrollEnd();
  refreshUsage();
}

/* ---------- 缓存续命：把刚聊的这一轮并进去 ----------
   只靠 pullHistory 写缓存有个死结：手机上聊完一轮，服务端的 message_count 就变了，
   而缓存里的 n 还是「拉历史那一刻」的值 → 下次点进来必判不命中，又拉 150–500 KB。
   实测六个会话 resume+history 合计 1.10 MB / 4.3 s，手机上更慢，这个漏洞等于白做缓存。
   所以每轮收尾把本轮两条并进 histAll，等 sessions.changed 那次防抖列表刷新落地，
   再按刷新后的 message_count 重写缓存。列表没刷新到就不写 —— 记一个偏小的 n 只会让
   下次多拉一次，绝不会显示错内容。 */
let cacheSyncT = 0, histEpoch = 0;
// 延迟多久把这一轮写进缓存：等 sessions.changed 那次 1.5s 防抖列表刷新落地。
// 做成变量是为了让验证脚本能把它压到几十毫秒（否则测试窗口 2.6s，中途来一次真实的
// 全量补拉就会把 histAll 换掉，测试跟着变成 flaky）。
let cacheSyncMs = 2600;
function rememberTurn(userText, asstText, hadImage){
  const sid = S.storedId;
  if (!sid || histSess !== sid) return;      // 现在画的不是这个会话的历史，别瞎拼
  // 图片附件的 @image:<path> 引用是网关在服务端补的，手机这边拼不出来 ——
  // 这时候宁可让缓存作废（下次全量拉一次），也别把缺图的版本写进去当命中。
  if (hadImage) return;
  const now = Date.now() / 1000;
  let added = 0;
  if (userText){ histAll.push({ role: 'user', text: userText, timestamp: now - 0.01 }); added++; }
  if (asstText){ histAll.push({ role: 'assistant', text: asstText, timestamp: now }); added++; }
  histShown += added;                        // 窗口跟着尾巴走，翻页下标才不漂
  const epoch = ++histEpoch;
  clearTimeout(cacheSyncT);
  cacheSyncT = setTimeout(() => {
    cacheSyncT = 0;
    if (epoch !== histEpoch) return;         // 期间已经补拉过全量（histAll 被服务端数据替换）
    if (S.storedId !== sid) return;          // 期间切走了
    const row = ALL.find(x => x.id === sid) || {};
    const n = Number(row.message_count) || 0;
    if (!n) return;                          // 列表还没刷新到，宁可下次多拉一次
    HCACHE.put(sid, histAll, n);
  }, cacheSyncMs);                            // 默认 2600：sessions.changed 防抖 1500 + 列表 100~200 + 余量
}

/* ---------- 历史渲染：默认最近 160 条，更早的按需往前翻 ----------
   以前是 slice(-160) 直接扔掉更早的（只留一句「已折叠」），可数据本来就整份
   在内存里，白扔。现在留住全量，点一下再翻 160 条；翻页后按 scrollHeight 差
   把视口钉在原处，别让人一翻就跳走。 */
const HIST_PAGE = 160;
let histAll = [], histShown = HIST_PAGE, histMore = null;
let histSess = '';       // histAll 里的数据属于哪个会话（分清「同会话补拉」和「换会话」）
let paintedFrom = 0;     // 已经画到 histAll 的哪个下标（增量翻页的锚点）
let histOldestTs = 0;    // 已画出来的最老一条的时间戳（算时间分隔符用）
let histPullCount = 0;   // 完成过几次全量 history（只读观测口，测试用）

function msgText(m){
  return (typeof m.text === 'string' ? m.text : (typeof m.content === 'string' ? m.content : '')) || '';
}

/* keepShown：同一个会话补拉（重连 / 点数变了 / 回前台）时要保留已经翻开的深度。
   换会话或首次渲染一律回到 160 —— 否则在 A 翻到 480，切到 B 也画 480 条。 */
function renderHistory(list, keepShown){
  const sid = S.storedId || '';
  const same = !!keepShown && sid === histSess;
  // 只留真会画出来的：assistant 行里有一大堆只带 tool 调用、text 是空串的壳，
  // 它们画不出气泡，但会把「还有 N 条」的数字撑大，也会占满 160 的窗口。
  histAll = (list || []).filter(m => m && (m.role === 'user' || m.role === 'assistant') && msgText(m));
  histSess = sid;
  histEpoch++;            // 数据被整体替换：让还没落地的「轮次续命」写缓存作废
  if (!same) histShown = HIST_PAGE;
  paintHistory();
}

function sepEl(ts){
  const sep = document.createElement('div');
  sep.className = 'sep';
  sep.textContent = fmtSep(ts);
  return sep;
}

/* 把一段消息建成 DocumentFragment，不碰 msgsEl —— 增量翻页只插新增的那段。
   prevTs 是这段之前那条的时间戳：决定第一条前面要不要补时间分隔符。 */
function buildChunk(part, prevTs){
  const frag = document.createDocumentFragment();
  let lastTs = prevTs || 0;
  for (const m of part){
    const text = msgText(m);
    if (!text) continue;
    const ts = m.timestamp || 0;
    if (ts && lastTs && (ts - lastTs) > 1800) frag.appendChild(sepEl(ts));
    if (ts) lastTs = ts;
    if (m.role === 'user'){
      frag.appendChild(makeRow('user', userHTML(text), fmtTs(m.timestamp)).row);
    } else {
      const r3 = makeRow('assistant', md(text), fmtTs(m.timestamp));
      decorateCode(r3.body);
      frag.appendChild(r3.row);
    }
  }
  return { frag, lastTs };
}

function moreEl(from){
  const more = document.createElement('div');
  more.className = 'more';
  more.textContent = '加载更早的 ' + Math.min(HIST_PAGE, from) + ' 条（还有 ' + from + ' 条）';
  more.onclick = expandOlder;
  return more;
}

/* 全量重画：换会话、或者补拉到新数据时走这里。 */
function paintHistory(){
  const from = Math.max(0, histAll.length - histShown);
  const part = histAll.slice(from);
  msgsEl.innerHTML = '';
  histMore = null;
  paintedFrom = from;
  histOldestTs = part.length ? (part[0].timestamp || 0) : 0;
  if (!part.length){
    msgsEl.innerHTML = '<div class="empty">这个会话还没有对话</div>';
    return;
  }
  if (from > 0){
    histMore = moreEl(from);
    msgsEl.appendChild(histMore);
  }
  msgsEl.appendChild(buildChunk(part, from > 0 ? (histAll[from - 1].timestamp || 0) : 0).frag);
}

/* 往前翻一页：只把新增的 160 条插到「加载更早」后面，已经画好的节点一个都不动。
   以前是清空整个列表重画 —— 翻到 480 条就是 480 个气泡 + 480 次 md() 重新解析，
   手机上真要卡半秒。 */
function expandOlder(){
  if (!histAll.length || paintedFrom <= 0) return histShown;
  histShown += HIST_PAGE;
  const nextFrom = Math.max(0, histAll.length - histShown);
  const chunk = histAll.slice(nextFrom, paintedFrom);
  // 视口补偿必须作用在真正的滚动容器（scroll = main）。以前量的是 msgsEl —— 它不是
  // 滚动容器，scrollTop 恒 0，那句赋值等于没写，全靠 Chrome 的 scroll anchoring 兜着；
  // 实测关掉 anchoring 立刻漂 −15607px。iOS 的 WKWebView 不做 anchoring，会直接跳走。
  const h0 = scroll.scrollHeight, t0 = scroll.scrollTop;
  // 自己补位移时先把浏览器的锚定关掉，否则两边各补一次 = 滚双倍
  const prevAnchor = scroll.style.overflowAnchor;
  scroll.style.overflowAnchor = 'none';
  const box = buildChunk(chunk, nextFrom > 0 ? (histAll[nextFrom - 1].timestamp || 0) : 0);
  // 新增段和已画段之间也可能跨了 30 分钟
  if (histOldestTs && box.lastTs && (histOldestTs - box.lastTs) > 1800) box.frag.appendChild(sepEl(histOldestTs));
  const anchor = histMore;
  if (anchor && anchor.parentNode) msgsEl.insertBefore(box.frag, anchor.nextSibling);
  else msgsEl.insertBefore(box.frag, msgsEl.firstChild);
  if (chunk.length && chunk[0].timestamp) histOldestTs = chunk[0].timestamp;
  paintedFrom = nextFrom;
  if (nextFrom > 0){
    const fresh = moreEl(nextFrom);
    if (anchor && anchor.parentNode) msgsEl.replaceChild(fresh, anchor);
    else msgsEl.insertBefore(fresh, msgsEl.firstChild);
    histMore = fresh;
  } else if (anchor && anchor.parentNode){
    msgsEl.removeChild(anchor);   // 翻到头了，按钮收掉
    histMore = null;
  }
  scroll.scrollTop = t0 + (scroll.scrollHeight - h0);
  requestAnimationFrame(() => { scroll.style.overflowAnchor = prevAnchor || ''; });
  return histShown;
}

/* ---------- model picker ---------- */
let MODEL_CACHE = null;
let MQ = '';

async function openModelPicker(){
  drawer.classList.remove('on');
  modelDrawer.classList.add('on');
  if (MODEL_CACHE){ renderModels(); return; }
  mlist.innerHTML = '<div class="empty">读取模型列表…<br><span style="font-size:11px">首次可能要几秒</span></div>';
  try {
    const res = await rpc('model.options', {session_id: S.sid}, 120000);
    MODEL_CACHE = res || {};
    renderModels();
  } catch(e){
    mlist.innerHTML = '<div class="empty">读取失败：' + esc(e.message) + '</div>';
  }
}

function renderModels(){
  const provs = ((MODEL_CACHE && MODEL_CACHE.providers) || []).slice();
  const curModel = (MODEL_CACHE && MODEL_CACHE.model) || '';
  const curProv = (MODEL_CACHE && MODEL_CACHE.provider) || '';
  const q = (MQ || '').trim().toLowerCase();
  if (!provs.length){ mlist.innerHTML = '<div class="empty">没有可用模型</div>'; return; }
  // current provider first
  provs.sort((a, b) => (b.is_current ? 1 : 0) - (a.is_current ? 1 : 0));
  mlist.innerHTML = '';
  let shown = 0;
  for (const p of provs){
    const all = p.models || [];
    const models = all.filter(m => {
      if (!q) return true;
      const name = typeof m === 'string' ? m : (m.id || m.name || m.label || '');
      return (String(name) + ' ' + p.slug).toLowerCase().indexOf(q) >= 0;
    });
    if (!models.length) continue;
    const h = document.createElement('div');
    h.className = 'grp';
    h.textContent = p.slug + (p.is_current ? '  · 当前' : '') +
                    (p.authenticated === false ? '  · 未授权' : '');
    mlist.appendChild(h);
    for (const m of models){
      const name = typeof m === 'string' ? m : (m.id || m.name || m.label || '');
      if (!name) continue;
      shown++;
      const el = document.createElement('div');
      el.className = 'item' + (p.slug === curProv && name === curModel ? ' cur' : '');
      el.innerHTML = '<div class="t"><div class="n">' + esc(name) + '</div></div>';
      el.onclick = () => switchModel(p.slug, name);
      mlist.appendChild(el);
    }
  }
  if (!shown) mlist.innerHTML = '<div class="empty">没有匹配「' + esc(MQ) + '」的模型</div>';
}

async function switchModel(slug, model){
  modelDrawer.classList.remove('on');
  toast('切换中…');
  try {
    const r = await rpc('slash.exec', {
      session_id: S.sid,
      command: '/model --provider ' + slug + ' ' + model
    }, 60000);
    const out = String((r && r.output) || '').replace(/\s+/g, ' ').trim();
    toast(out.slice(0, 50) || '已切换');
    MODEL_CACHE = null;
    setTimeout(refreshUsage, 500);
  } catch(e){
    toast('切换失败：' + e.message);
  }
}

async function newSession(){
  drawer.classList.remove('on');
  clearMsgs();
  S.storedId = null; S.sid = null; S.title = '新对话';
  $('#ttlMain').textContent = '新对话';
  $('#ttlSub').textContent = '新建中…';
  try {
    const res = await rpc('session.create', {source:'tui'}, 30000);
    S.sid = res.session_id || null;
    S.storedId = res.stored_session_id || null;
    $('#ttlSub').textContent = '已就绪';
    setSendEnabled(true);
    ta.focus();
  } catch (e){
    $('#ttlSub').textContent = '新建失败';
    flashConn('新建失败：' + e.message, true);
  }
}

/* ---------- image attach ---------- */
function compressToB64(file, maxPx){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const max = maxPx || 1600;
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) throw new Error('empty image');
        if (Math.max(w, h) > max){
          const k = max / Math.max(w, h);
          w = Math.max(1, Math.round(w * k));
          h = Math.max(1, Math.round(h * k));
        }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.85);
        URL.revokeObjectURL(url);
        resolve(dataUrl.split(',')[1]);
      } catch(e){
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('读不出这张图')); };
    img.src = url;
  });
}

async function attachImage(file){
  if (!S.sid){ toast('先选一个会话'); return; }
  const stopTick = uploadTick('处理图片 ' + humanSize(file.size));
  let b64;
  try { b64 = await compressToB64(file, 1600); }
  catch(e){ stopTick(); toast('图片读取失败'); return; }
  try {
    await rpc('image.attach_bytes', {
      session_id: S.sid,
      content_base64: b64,
      filename: file.name || 'photo.jpg'
    }, 90000);
    pendingImgs.push({url: URL.createObjectURL(file), name: file.name || 'image'});
    renderAttaches();
    haptic(10);
    toast('已附加图片');
  } catch(e){
    toast('附加失败：' + e.message);
  } finally {
    stopTick();
  }
}

function humanSize(n){
  if (!n || n < 1024) return (n || 0) + ' B';
  if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
function readAsDataURL(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ''));
    fr.onerror = () => reject(new Error('读不出这个文件'));
    fr.readAsDataURL(file);
  });
}

// 任意文件：走网关的 file.attach，字节用 data_url 带过去，网关存进
// %LOCALAPPDATA%\hermes\attachments\ 并回一个 @file:<绝对路径>。发送时把这个
// 引用前置到正文，模型就能用文件工具读它。
// 图片仍走 image.attach_bytes —— 那条路会把像素真的喂给模型，能力和这条不一样。
async function attachFile(file){
  if (!S.sid){ toast('先选一个会话'); return; }
  const name = file.name || 'file';
  if (file.size > FILE_MAX){
    toast('文件太大：' + humanSize(file.size) + '，上限 ' + humanSize(FILE_MAX));
    return;
  }
  toast('上传中 ' + name + '…');
  let dataUrl;
  const stopTick = uploadTick('上传 ' + name + '（' + humanSize(file.size) + '）');
  try { dataUrl = await readAsDataURL(file); }
  catch(e){ stopTick(); toast('文件读取失败'); return; }
  try {
    const res = await rpc('file.attach', {
      session_id: S.sid,
      data_url: dataUrl,
      name: name
    }, 180000);
    pendingFiles.push({ name: res.name || name, size: file.size, ref: res.ref_text });
    renderAttaches();
    haptic(10);
    toast('已附加 ' + (res.name || name));
  } catch(e){
    toast('附加失败：' + e.message);
  } finally {
    stopTick();
    syncSendBtn();
  }
}

function renderAttaches(){
  if (!pendingImgs.length && !pendingFiles.length){
    attaches.classList.remove('on');
    attaches.innerHTML = '';
    return;
  }
  attaches.classList.add('on');
  attaches.innerHTML = '';
  pendingImgs.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const im = document.createElement('img');
    im.src = it.url;
    d.appendChild(im);
    const x = document.createElement('button');
    x.textContent = '×';
    x.onclick = () => { const [it2] = pendingImgs.splice(i, 1); try { URL.revokeObjectURL(it2.url); } catch(e){} renderAttaches(); };
    d.appendChild(x);
    attaches.appendChild(d);
  });
  pendingFiles.forEach((it, i) => {
    const d = document.createElement('div');
    d.className = 'fu';
    const box = document.createElement('div');
    const fn = document.createElement('div');
    fn.className = 'fn'; fn.textContent = it.name;
    const fs = document.createElement('div');
    fs.className = 'fs'; fs.textContent = humanSize(it.size);
    box.appendChild(fn); box.appendChild(fs);
    d.appendChild(box);
    const x = document.createElement('button');
    x.textContent = '×';
    x.onclick = () => { pendingFiles.splice(i, 1); renderAttaches(); };
    d.appendChild(x);
    attaches.appendChild(d);
  });
}

function clearAttaches(){
  for (const it of pendingImgs){ try { URL.revokeObjectURL(it.url); } catch(e){} }
  pendingImgs = [];
  pendingFiles = [];
  renderAttaches();
}

/* ---------- send ---------- */
let CAN_SEND = false;
function setSendEnabled(on){ CAN_SEND = on; syncSendBtn(); }
function syncSendBtn(){
  if (S.streaming){
    sendBtn.textContent = '停止';
    sendBtn.classList.add('stop');
    sendBtn.disabled = false;
  } else {
    sendBtn.textContent = '发送';
    sendBtn.classList.remove('stop');
    sendBtn.disabled = !CAN_SEND || (!ta.value.trim() && !pendingImgs.length && !pendingFiles.length);
  }
}
async function stopTurn(){
  const sid = S.sid;
  S.streaming = false;
  S.autoScroll = true;
  syncSendBtn();
  haptic(15);
  if (!sid) return;
  try {
    await rpc('session.interrupt', {session_id: sid}, 15000);
    toast('已停止');
  } catch (e){
    toast('停止失败：' + e.message);
  }
}

function autoGrow(){
  ta.style.height = 'auto';
  ta.style.height = Math.min(132, ta.scrollHeight) + 'px';
}

// 非图片附件的引用必须前置进正文（Desktop 端也是这么拼的），否则模型只看到
// 「看这个文件」却没有路径。抽成纯函数，验证脚本可以只验拼装、不真的发出去。
function buildPayload(text){
  const refs = pendingFiles.map(f => f.ref).filter(Boolean).join('\n');
  const body = text || (pendingImgs.length ? '看这张图' : (pendingFiles.length ? '看这个文件' : ''));
  return refs ? refs + '\n' + body : body;
}

async function send(){
  const text = ta.value.trim();
  const hasImg = pendingImgs.length > 0;
  const hasFile = pendingFiles.length > 0;
  if ((!text && !hasImg && !hasFile) || S.streaming) return;
  if (!S.sid){
    await newSession();
    if (!S.sid) return;
  }
  // 上一轮被「停止」或出错时留下的半截气泡还挂在 S.cur 上：不收尾的话，这一轮的回答
  // 会拼进那个旧气泡（startAssistant 见 S.cur 就直接返回它）。
  if (S.cur) abortStream('已中断');
  // 非图片附件靠 @file:<path> 引用传给模型（Desktop 端也是这么拼的）。引用必须
  // 前置，且每条带自己的名字，模型才知道哪个文件是哪个。
  const payload = buildPayload(text);
  // 记住这一轮发出去的东西：收尾时要把它们并进本地缓存（见 rememberTurn）。
  // 用 payload 而不是显示文本 —— 服务端存的就是 payload（带 @file: 引用），
  // 这样缓存里那一行和真拉回来的历史长得一样。
  S.turnUserText = payload; S.turnMedia = hasImg;
  ta.value = ''; autoGrow(); clearDraft();
  haptic(10);
  S.autoScroll = true;
  const userEv = addUser(text || (hasFile ? '（文件）' : '（图片）'));
  clearAttaches();
  S.streaming = true; setSendEnabled(false);
  try {
    const ack = await rpc('prompt.submit', {session_id: S.sid, text: payload}, 30000);
    if (ack && ack.status && ack.status !== 'streaming' && ack.status !== 'queued'){
      flashConn('状态: ' + ack.status, false);
    }
    syncSub();
    if (!S.cur) startAssistant();
  } catch (e){
    S.streaming = false; setSendEnabled(true);
    flashConn('发送失败：' + friendlyErr('prompt.submit', e.message), true);
    if (userEv) userEv.row.classList.add('failed');
    attachRetry(userEv, payload);
  }
}

/* ---------- boot ---------- */
async function authed(){
  try {
    const r = await fetchT('/api/auth/me', {credentials:'same-origin'}, 8000);
    return r.ok ? await r.json() : null;
  } catch(e){ return null; }
}

// 网页端的登录表单默认值。口令**不预填**（以前写死过一个，等于把密码编进静态页）：
// 用户名给个默认，密码留空，第一次手输，之后浏览器自己的密码管理器接管。
const DEF_U = 'hermes', DEF_P = '';
// 原来是一次性锁存：网关恰好在你开 App 时重启 → 第一次自动登录失败后就永远躺平，
// 服务起来了页面还停在登录框上，只能手点。改成有限次退避重试。
let loginTries = 0, loginRetryT = 0, autoSubmit = false;
function autoLogin(){
  if (loginTries >= 6) return;            // 6 次（约 2 分钟）还不行就停手，交给人
  loginTries++;
  if (!$('#lu').value) $('#lu').value = DEF_U;
  if (!$('#lp').value) $('#lp').value = DEF_P;
  autoSubmit = true;
  setTimeout(() => {
    const f = $('#loginForm');
    try { f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event('submit', {cancelable:true})); }
    catch(e){ autoSubmit = false; }
  }, 120);
}
function loginBackoff(){
  clearTimeout(loginRetryT);
  loginRetryT = setTimeout(connect, Math.min(30000, 2000 * Math.pow(2, Math.min(loginTries, 4))));
}

// 连接重试：原来 connect() 只要抛一次就停在登录框上，谁也不再去试 —— 网关重启、
// 换网、IPv6 前缀漂移都会让它永久躺平。现在任何失败路径都必须排下一次重试。
let reconnT = 0, reconnTries = 0, connecting = false, reconnCalls = 0;
function scheduleReconnect(ms){
  clearTimeout(reconnT);
  reconnCalls++;      // 只增不减的「排过几次重试」计数：验证脚本靠它证明没停摆（tries 连上就归零）
  const wait = ms != null ? ms : Math.min(8000, 600 * Math.pow(1.6, Math.min(reconnTries++, 6)));
  reconnT = setTimeout(() => { reconnT = 0; connect(); }, wait + Math.random() * 300);
}

async function connect(){
  if (connecting) return;
  if (S.ws && S.ws.readyState === 1 && S.sid) return;   // 已经连着就别开第二条
  connecting = true;
  if (!(S.ws && S.ws.readyState === 1)) setConn('连接中…');
  try {
    const me = await authed();
    if (!me){ $('#login').classList.add('on'); autoLogin(); return; }
    $('#login').classList.remove('on');
    try {
      const saved = localStorage.getItem('hermes.session');
      if (saved && !S.storedId) S.storedId = saved;
    } catch(e){}
    // 已经连着但没有会话（比如 resume 失败过）时上面的早退条件不成立，这里会再开一条 socket。
    // 旧那条还活着、还在派帧，必须先关干净 —— 否则两条并存，后一条的引用会被前一条的
    // close 抹掉（见 openWs 里的身份检查）。
    if (S.ws){
      try { S.ws.onopen = S.ws.onmessage = S.ws.onclose = S.ws.onerror = null; S.ws.close(); } catch(e){}
      S.ws = null;
    }
    await openWs();
    // 列表先拉：下面补历史时要把 message_count 写进缓存当「有没有变」的信号，
    // 顺序反了 ALL 还是空的，就会写成 n=0 —— 那样缓存永远命中不了。
    const r = await rpc('session.list', {limit: 200}, 20000);
    ALL = (r.sessions || r.rows || []).filter(x => x && x.id);
    if (S.storedId){
      try {
        // 先画本地缓存：锁屏回来 / 冷启动别对着空消息区干等 0.3~1 s 的全量。
        let rec = null;
        try { rec = await HCACHE.get(S.storedId); } catch(e){}
        const bootRow = ALL.find(x => x.id === S.storedId) || {};
        if (rec){
          renderHistory(rec.msgs);
          scrollEnd();
          $('#ttlSub').textContent = '缓存 ' + relTime(rec.t / 1000) + ' · 同步中…';
        }
        const res = await rpc('session.resume', {session_id: S.storedId, source:'tui',
                                                inline_images:false, defer_history:true}, 60000);
        if (res.session_id) S.sid = res.session_id;
        if (res.info && res.info.title) S.title = res.info.title;
        replayServerRequests(res);
        // 点数没变 = 没有新消息，缓存就是最新的：这一条路以前是无条件拉全量，
        // 等于每次冷启动都白扔一次 150–500 KB / 0.5–1 s。
        if (cacheHitFor(rec, bootRow)){
          syncSub(); setSendEnabled(true); refreshUsage();
        } else if (S.sid){
          await pullHistory(S.storedId || S.sid, openSeq);
        }
      } catch(e){}
    }
    // 同样不重排：服务端给的就是最近活动序，real[0] 因此就是「最后动过的那个会话」
    if (ALL.length && !S.storedId){
      const real = ALL.filter(x => (x.source || '') !== 'cron' && (x.message_count || 0) > 0);
      openSession(real.length ? real[0] : ALL[0]);
    }
  } catch (e){
    const msg = String((e && e.message) || e);
    // 401 = cookie 没了，走登录；其余（网关重启 / 网络抖动 / 地址变了）退避后再连
    if (/\b401\b/.test(msg)) { $('#login').classList.add('on'); autoLogin(); }
    else {
      setConn('连接失败，重试中…', true);
      scheduleReconnect();
    }
  } finally {
    connecting = false;
  }
}

$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('#loginErr').textContent = '';
  try {
    const r = await fetchT('/auth/password-login', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({provider:'basic', username: $('#lu').value, password: $('#lp').value})
    }, 12000);
    if (!r.ok){
      // 429 = 网关的暴力破解节流（10 次/60 秒，按客户端 IP）。继续自动重试只会
      // 把自己的窗口越撑越长，看起来就是「一直连不上」——停手，交给人过一分钟再点。
      if (r.status === 429){
        $('#loginErr').textContent = '登录试太多次了，等 1 分钟再点「重新连接」';
        loginTries = 6; autoSubmit = false;
        clearTimeout(loginRetryT);
        return;
      }
      $('#loginErr').textContent = r.status === 401 ? '用户名或密码不对' : ('登录失败 ' + r.status);
      // 自动填的这轮失败 → 多半是网关还没起来，退避后再试；手输的就别烦人，等他自己改
      if (autoSubmit) loginBackoff();
      autoSubmit = false;
      return;
    }
    loginTries = 0; autoSubmit = false;
    clearTimeout(loginRetryT);
    $('#login').classList.remove('on');
    connect();
  } catch (e){ $('#loginErr').textContent = friendlyErr('login', e.message); autoSubmit = false; }
});

/* long-press a bubble to copy its text */
let pressTimer = null, pressAt = null, pressBubble = null;
const PRESS_SLOP = 10;     // 手指容差（px）：550ms 内零位移在真机上不可能，3px 抖动不该取消
msgsEl.addEventListener('touchstart', ev => {
  const b = ev.target.closest ? ev.target.closest('.bubble') : null;
  if (!b) return;
  // 长按图片交给系统（WebView 的「保存图片」）；否则这里会顺手把整段文字复制走，
  // 用户想存图却得到一段文本（实测长按图片复制到的是「图 0」这种正文）。
  if (ev.target.closest && ev.target.closest('img.hi')) return;
  const t = ev.touches && ev.touches[0];
  pressAt = t ? { x: t.clientX, y: t.clientY } : null;
  pressBubble = b;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    pressTimer = null;
    if (!pressBubble) return;
    copyText(bubbleText(pressBubble));
    pressBubble.style.transition = 'box-shadow .15s';
    pressBubble.style.boxShadow = '0 0 0 2px var(--acc)';
    const el = pressBubble;
    setTimeout(() => { el.style.boxShadow = ''; }, 600);
  }, 550);
}, {passive: true});
// 只有明显滑动才取消（以前 move 一触发就 clearTimeout，等于长按成功率接近 0）
msgsEl.addEventListener('touchmove', ev => {
  if (!pressTimer || !pressAt) return;
  const t = ev.touches && ev.touches[0];
  if (!t) return;
  const dx = t.clientX - pressAt.x, dy = t.clientY - pressAt.y;
  if (dx * dx + dy * dy > PRESS_SLOP * PRESS_SLOP) { clearTimeout(pressTimer); pressTimer = null; }
}, {passive: true});
['touchend','touchcancel'].forEach(t =>
  msgsEl.addEventListener(t, () => { clearTimeout(pressTimer); pressTimer = null; }, {passive: true}));

/* 长按复制要复制的正文。必须摘掉「复制」按钮和时间戳：
   它们也在 .bubble 里，innerText 会把「复制」两个字一起带出去（实测复制代码块末尾多一行“复制”）。
   clone 得挂进文档 —— 离屏节点的 innerText 会退化成 textContent，换行全丢。 */
function bubbleText(b){
  if (!b) return '';
  const clone = b.cloneNode(true);
  try { clone.querySelectorAll('.cc, .meta').forEach(x => x.remove()); } catch(e){}
  clone.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + (b.clientWidth || 300) + 'px';
  document.body.appendChild(clone);
  const t = String((clone.innerText || clone.textContent || '')).trim();
  try { clone.remove(); } catch(e){}
  return t;
}

function copyText(t){
  if (!t) return;
  const done = () => { haptic(8); toast('已复制'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done){
  const x = document.createElement('textarea');
  x.value = t;
  x.style.position = 'fixed'; x.style.left = '-9999px'; x.style.top = '0';
  document.body.appendChild(x);
  x.select(); x.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败'); }
  x.remove();
}

    if (r.ok){ const j = await r.json(); urls = j.urls || []; stamp = j.updated || ''; }

  box.innerHTML = '<div class="ah2">服务端地址 · 点一下复制</div>' +
    urls.map(u => '<div class="u" data-u="' + esc(u) + '">' + esc(u) + '</div>').join('') +
    (stamp ? '<div class="stamp">' + esc(stamp.slice(0, 19).replace('T', ' ')) + ' 更新</div>' : '');
  const nodes = box.querySelectorAll ? box.querySelectorAll('.u') : [];
  for (const n of nodes) n.onclick = () => copyText(n.dataset ? n.dataset.u : n.textContent);
}

/* ---------- 壳版本 / APK 更新提示 ----------
 * 页面不知道自己跑在哪个版本的壳里，问 HermesApp（MainActivity 注入，只回版本号）。
 * 浏览器里打开时没有这个对象，整段静默跳过。
 */
const SHELL = (() => {
  try { return window.HermesApp ? JSON.parse(window.HermesApp.version()) : null; }
  catch(e){ return null; }
})();

async function checkUpdate(){
  if (!SHELL || !SHELL.code) return;
  let v;
  try {
    const r = await fetch('version.json', {cache:'no-store'});
    if (!r.ok) return;
    v = await r.json();
  } catch(e){ return; }
  if (!v || !v.code || v.code <= SHELL.code) return;
  const a = $('#upd');
  if (!a) return;
  const b = a.querySelector('b');
  if (b) b.textContent = v.name || ('#' + v.code);
  a.hidden = false;
}
checkUpdate();

/* ---------- 心跳 / 僵尸 socket / 回前台重连 (#4) ---------- */
const PING_MS = 15000, STALE_MS = 45000;
let pingSeq = 0;
setInterval(() => {
  const ws = S.ws;
  if (!ws || ws.readyState !== 1) return;
  // 45s 内一帧都没收到 → 判僵尸（锁屏后 WebView 被冻结最常见：readyState 还是 1，
  // 发出去的东西全掉进虚空），主动拆掉，让 onclose 走重连退避
  if (S.lastFrameAt && Date.now() - S.lastFrameAt > STALE_MS){
    flashConn('连接已失效，重连中…', true);
    try { ws.close(); } catch(e){}
    return;
  }
  // 旧写法 method:'ping' 网关其实会回一帧 {pong:true}，但页面从来不读回包，
  // 所以连接是死是活它自己也不知道 —— 真正缺的是上面这个 lastFrameAt 看门狗。
  // 顺带换成 gateway.ping：ws.py:708 的快速通道，直接回 {ok:true} 并回显 id
  try { ws.send(JSON.stringify({jsonrpc:'2.0', id:'ping-' + (++pingSeq), method:'gateway.ping', params:{}})); } catch(e){}
}, PING_MS);

window.addEventListener('pagehide', () => IMGDIM.flush());
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ IMGDIM.flush(); return; }
  const ws = S.ws;
  if (!ws){ connect(); return; }
  if (ws.readyState === 1 && S.lastFrameAt && Date.now() - S.lastFrameAt > STALE_MS){
    try { ws.close(); } catch(e){}
  } else if (ws.readyState === 3){
    connect();
  }
  refreshSessions();       // 回前台顺手把列表对一次账（别处可能已经改了会话）
});

// 调试钩子：console 里 __hm.state() 看连接年龄，__hm.goStale() 手工喂一个假僵尸
window.__hm = {
  state: () => ({ connected: !!(S.ws && S.ws.readyState === 1), retries: S.retries,
                  lastFrameAge: S.lastFrameAt ? Date.now() - S.lastFrameAt : null,
                  sessions: ALL.length, sid: S.sid, streaming: S.streaming, loginTries,
                  reconnTries, connecting, files: pendingFiles.length, imgs: pendingImgs.length }),
  goStale: () => { S.lastFrameAt = Date.now() - 60000; },
  drop: () => { try { S.ws && S.ws.close(); } catch(e){} },
  kick: () => { connecting = false; connect(); },
  // 验证用：塞一个假附件（真文件已经由 file.attach 上传过，这里只验发送时引用有没有拼进正文）
  fakeFile: (name, ref) => { pendingFiles.push({ name, size: 4096, ref }); renderAttaches(); syncSendBtn(); },
  retry: () => ({ calls: reconnCalls, armed: !!reconnT, tries: reconnTries }),
  // 只验「正文怎么拼」的纯函数。绝不给验证脚本一个能真发 prompt 的入口：
  // 页面启动会自动打开最近的真实会话，一 send 就是往用户的对话里塞消息。
  payload: (text) => buildPayload(text),
  attachFile: (f) => attachFile(f),
  clearAttaches: () => clearAttaches(),
  // 会话历史缓存的入口：验证脚本要证明「第二次点进同一个会话时先画缓存、不等网络」
  histCache: () => HCACHE,
  openSession: (row) => openSession(row),
  // 历史翻页 / 缓存命中判定 / 流式节流，给 harness 用（都不是发送入口）
  histState: () => ({ all: histAll.length, shown: histShown, more: !!(histMore && histMore.textContent) }),
  expandOlder: () => { if (histMore && histMore.onclick) histMore.onclick(); return histShown; },
  cacheHitFor: (rec, row) => cacheHitFor(rec, row),
  renderHistory: (l, keep) => renderHistory(l, keep),
  streamAppend: (t) => appendAssistant(t),
  streamState: () => (S.cur ? { len: S.cur.text.length, html: ((S.cur.body && S.cur.body.innerHTML) || '').length } : null),
  // 增量翻页要证明「已画出来的节点没被推倒重来」：数量只增不减，且同一个气泡对象还在列表里
  histDom: () => ({ nodes: (msgsEl.children || []).length, oldest: histOldestTs, paintedFrom }),
  histPulls: () => histPullCount,
  histFirstBubble: () => (msgsEl.children || []).find(n => n && /(^| )row( |$)/.test(n.className || '')) || null,
  // 收尾把本轮并进缓存（P1）：harness 直接调它，不必真发一条 prompt
  rememberTurn: (u, a, img) => rememberTurn(u, a, img),
  setCacheSyncMs: (n) => { cacheSyncMs = Number(n) || 2600; return cacheSyncMs; },
  uploadTick: (label) => uploadTick(label),   // 返回 stop()，验证脚本用它确认「上传期间提示不会消失」
  imgDim: () => IMGDIM.size(),               // 图片尺寸记忆里有几条
  imgDimSet: (p, w, h) => { IMGDIM.set(p, w, h); return IMGDIM.get(p); },
  imgDimClear: () => { IMGDIM.clear(); return IMGDIM.size(); },
  // 图片路径：历史里的 @image: 现在应该走鉴权的 /api/fs/download，而不是 /assets/img
  imgTag: (p) => imgTag(p),
  // 缓存续命 / 列表分组 / 上传上限的观测口（都是只读状态，没有发送入口）
  stored: () => ({ storedId: S.storedId, sid: S.sid, histSess }),
  useStored: (id) => { S.storedId = id; },
  // 只给验证用：事件过滤器按 S.sid 判断归属，测试需要一个确定的 sid。
  useSid: (id) => { S.sid = id; return S.sid; },
  realRow: () => {
    const r = ALL.find(x => (x.message_count || 0) > 0 && (x.source || '') !== 'cron');
    return r ? { id: r.id, message_count: r.message_count } : null;
  },
  // 注意：真浏览器里 children 是 HTMLCollection，没有 filter/indexOf —— 得先转数组，
  // 否则这两个口一调就抛（harness 的 shim 给的是数组，所以套件里看不出来）。
  hasNode: (n) => Array.prototype.indexOf.call(msgsEl.children || [], n) >= 0,
  fileMax: () => FILE_MAX,
  listIds: (n) => ALL.slice(0, n || 3).map(r => ({ id: r.id, title: (r.title || '').slice(0, 12) })),
  md: (t) => md(t),                        // 纯函数：markdown 渲染结果直接可断言
  abortStream: (why) => abortStream(why),  // 断线收尾（onclose 里也调它）
  // 验证用：喂一条网关事件，验「出错/断线之后下一轮不会拼进旧气泡」「别的会话的帧不画」。
  // 它只改页面状态，不发任何请求，也不碰 prompt.submit。
  event: (p) => { onEvent(p || {}); return { streaming: S.streaming, cur: !!S.cur,
    rows: (msgsEl.children || []).length }; },
  renderList: () => renderList(),          // 只重画抽屉列表，不发任何请求
  listDom: () => { const k = Array.from(listEl.children || []);
                   return { total: k.length,
                            grps: k.filter(n => /(^| )grp( |$)/.test((n && n.className) || '')).length }; },
};
})();
